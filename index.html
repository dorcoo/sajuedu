            { id: 'gap', hanja: '甲', korean: '갑', element: '목(木)', yinyang: '양(+)', desc: '하늘로 곧게 뻗어 올라가는 큰 나무나 숲을 상징합니다. 진취적이고 우두머리 기질이 있으며 시작을 의미합니다.', abundanceDesc: '고집이 너무 세고 타협을 모르며, 뻣뻣하여 부러지거나 타인과 마찰이 잦을 수 있습니다.' },
            { id: 'eul', hanja: '乙', korean: '을', element: '목(木)', yinyang: '음(-)', desc: '바람에 흔들리는 풀, 넝쿨, 화초를 상징합니다. 환경 적응력이 뛰어나고 유연하며 생명력이 강합니다.', abundanceDesc: '줏대가 약해지고 이리저리 흔들리며, 잡초처럼 엉켜 일이 복잡해지거나 의존적이 될 수 있습니다.' },
            { id: 'byeong', hanja: '丙', korean: '병', element: '화(火)', yinyang: '양(+)', desc: '세상을 밝게 비추는 태양을 상징합니다. 열정적이고 명랑하며, 숨김없이 드러내는 솔직한 성향입니다.', abundanceDesc: '성격이 지나치게 급하고 다혈질이 되며, 감정 기복이 심해 구설수나 시비에 휘말리기 쉽습니다.' },

            { id: 'gi', hanja: '己', korean: '기', element: '토(土)', yinyang: '음(-)', desc: '곡식을 길러내는 비옥한 논밭이나 정원을 상징합니다. 섬세하고 실속을 챙기며 어머니 같은 자애로움이 있습니다.', abundanceDesc: '속을 알 수 없고 의심이 많아지며, 이기적인 성향이나 결정장애(우유부단함)가 심해질 수 있습니다.' },

            { id: 'jin', hanja: '辰', korean: '진', animal: '용', element: '토(土)', yinyang: '양(+)', season: '봄 (3월)', desc: '만물이 쑥쑥 자라나는 늦봄의 촉촉한 땅입니다. 이상이 높고 스케일이 크며, 변화무쌍하고 다양한 잠재력을 품고 있습니다.', abundanceDesc: '허세가 심하고 이상만 앞서 현실성이 떨어지며, 대인관계의 구설수와 피부/위장 질환에 취약해집니다.' },

            '정묘': { trait: '달빛이 비추는 밤에 피어난 아름다운 화초나 잔디에 불이 붙은 형상입니다. 감수성이 대단히 예민하고 섬세하며, 미적 안목과 예술적 감각이 매우 탁월합니다. 겉로는 다정다감하고 타인을 부드럽게 잘 챙기지만, 내면은 신경이 날카롭고 변덕이 심해 스스로 상처를 받거나 대인관계에서 기복을 겪기 쉽습니다. 눈치가 빠르고 직관력이 좋아 상대방의 마음을 잘 읽어내며, 기획이나 아이디어를 내는 일에 능합니다.', shinsal: ['구추방해', '도화살', '현침살', '태극귀인', '철사관'] },
            '무진': { trait: '거대한 흙산이 첩첩이 쌓여 있거나 끝없이 펼쳐진 넓은 평야(또는 진흙 속의 황룡)의 형상입니다. 스케일이 매우 크고 포용력이 있으며, 한 번 마음먹은 일은 엄청난 뚝심과 은근한 고집으로 기어코 밀어붙이는 돌파력을 지녔습니다. 리더십과 책임감이 강하여 난관 속에서도 조직의 든든한 기둥 역할을 해냅니다. 다만 지나친 아집과 자존심 때문에 타인의 충고를 무시하고 독단적으로 행동하다가 마찰을 빚을 수 있으니 유연함이 필요합니다.', shinsal: ['백호대살', '괴강살', '홍염살', '수관', '평두살'] },
            '기사': { trait: '뜨거운 불기운을 머금은 비옥한 조그만 논밭(또는 붉은 뱀)의 형상입니다. 두뇌 회전이 대단히 빠르고 눈치가 빠르며, 상황 파악과 융통성을 발휘해 자신에게 유리한 쪽으로 실속을 챙기는 능력이 뛰어납니다. 겉으로는 부드럽고 유순해 보이나 속에는 불같은 열정과 독기를 품고 있어 한 번 화가 나면 무섭습니다. 꼼꼼하고 완벽을 추구하며 역마의 기운이 있어 활동 반경이 넓고 다양한 분야에서 재주를 뽐냅니다.', shinsal: ['금여', '역마살', '곡각살', '퇴신', '십악대패'] },
            '경오': { trait: '뜨거운 용광로 속에서 벌겋게 달궈지며 제련되고 있는 강력한 쇠붙이(또는 백마)의 형상입니다. 성품이 반듯하고 거짓이나 불의를 참지 못하는 강직함과 원칙주의적인 성향을 지녔습니다. 외모가 수려하고 단정한 경우가 많으며, 어떤 일을 하든 공명정대하게 처리하려 합니다. 시련과 담금질을 거쳐 훌륭한 그릇으로 완성되는 기운이기에 고난을 이겨내는 힘이 강하지만, 융통성이 부족해 스스로를 피곤하게 만들 수 있습니다.', shinsal: ['도화살', '탕화살', '태극귀인', '복성귀인', '십악대패'] },
            '신미': { trait: '뜨겁고 건조한 여름의 흙 위에 놓인 날카롭고 정교한 보석의 형상입니다. 대단히 예민하고 섬세하며, 매사를 완벽하게 처리하려는 깔끔한 성격을 지녔습니다. 겉보기엔 부드럽고 조용해 보이지만 내면은 건조하고 깐깐하며 자존심이 하늘을 찌릅니다. 직관력과 분석력이 매우 뛰어나고 손재주나 특수한 기술을 활용하는 일에 탁월합니다. 다만 까칠한 성격 탓에 대인관계에서 차가운 인상을 주어 고독해지기 쉽습니다.', shinsal: ['현침살', '과숙살', '음양살', '철사관'] },
            '임신': { trait: '거대한 바위틈에서 끊임없이 솟아오르는 맑고 차가운 강물(또는 검은 원숭이)의 형상입니다. 마르지 않는 샘물처럼 두뇌가 비상하고 다재다능하며, 어떤 변화무쌍한 환경 속에서도 막힘없이 유연하게 적응해 내는 수완이 탁월합니다. 호기심이 많고 배움에 대한 열정이 가득해 아는 것이 많습니다. 언변이 좋고 재치가 넘쳐 주변의 인기를 얻지만, 한 곳에 오래 정착하지 못하고 변덕을 부리거나 권태를 빨리 느끼는 단점이 있습니다.', shinsal: ['학당귀인', '지살', '현침살', '태극귀인', '수옥살'] },
            '계유': { trait: '깨끗한 바위나 옥구슬 위에 맺힌 맑은 이슬이나 시냇물의 형상입니다. 맑고 투명함을 추구하는 성품으로, 지저분하고 탁한 것을 극도로 싫어하는 결벽증적 성향이 있습니다. 기억력이 비상하고 영감과 직관력이 매우 뛰어나 예술적, 정신적 분야에서 크게 두각을 나타냅니다. 성격이 조용하고 차분하지만 한 번 마음이 상하면 차갑게 돌아서는 냉정함이 있으며, 외로움을 즐기면서도 고독에 취약한 양면성을 가졌습니다.', shinsal: ['도화살', '장성살', '태극귀인', '비인살'] },
            '갑술': { trait: '가을의 마른 땅 위나 척박한 바위산에 뿌리를 내리려 애쓰는 외로운 소나무의 형상입니다. 환경은 척박하지만 어떻게든 살아남으려는 대단한 인내심과 독립심, 그리고 강한 책임감을 지녔습니다. 호기심이 많아 다양한 분야에 관심을 보이고 아이디어가 풍부합니다. 메마른 기운 탓에 내면의 고독감과 우울감을 안고 살아가기 쉬우나, 종교나 교육, 철학, 남을 돕는 활인업(活人業)에 종사하면 이러한 기운을 크게 좋게 승화시킬 수 있습니다.', shinsal: ['현침살', '과숙살', '평두살', '십악대패'] },
            '을해': { trait: '드넓은 호수나 강물 위에 둥둥 떠다니는 수초나 연꽃의 형상입니다. 고정된 틀에 얽매이기보다는 자유롭게 세상을 유랑하며 사색을 즐기는 지혜롭고 낭만적인 성향을 지녔습니다. 물처럼 유연하고 부드러운 처세술로 어떤 환경에도 자연스럽게 녹아들며 대인관계가 원만합니다. 그러나 뿌리가 물에 떠 있어 삶의 안정을 찾기까지 방황이 잦을 수 있고, 끈기가 부족해 일을 끝까지 매듭짓는 능력을 의식적으로 길러야 합니다.', shinsal: ['십악대패', '지살', '곡각살', '태극귀인', '암록'] },
            '병자': { trait: '한밤중 고요한 호수 위를 비추는 밝은 빛이나, 차가운 물속에 몸을 담근 뜨거운 태양의 형상입니다. 수화기제(물과 불의 조화)의 형상으로 단정하고 예의가 바르며, 극단으로 치우치지 않으려는 균형 감각을 지녔습니다. 화려함을 좋아하면서도 내면은 이성적이고 차분합니다. 사람들과 잘 어울리고 대인관계가 좋지만, 물과 불이 교차하는 만큼 속으로는 감정 기복이 심하고 이성 문제나 비밀스러운 연애사에 휘말릴 소지가 있습니다.', shinsal: ['교신살', '복성귀인', '태극귀인', '양착살'] },
            '정축': { trait: '차갑게 언 땅을 녹이기 위해 조용히 타오르는 화로 속의 불씨나 모닥불의 형상입니다. 자신을 희생하여 남을 돕고자 하는 따뜻한 봉사 정신과 자비심을 지녔습니다. 겉보기엔 약해 보여도, 얼음을 녹여내는 대단한 끈기와 집념을 숨기고 있어 어떤 시련도 묵묵히 이겨냅니다. 세심하고 치밀하여 재물을 관리하는 능력이 뛰어나지만, 어두운 환경 탓에 내면의 우울감이나 비관적인 생각에 젖기 쉬우니 긍정적인 마음가짐이 필요합니다.', shinsal: ['백호대살', '탕화살', '퇴신', '태극귀인', '화개살'] },
            '무인': { trait: '깊은 숲속에 우뚝 솟은 거대한 태산이나, 산의 왕인 호랑이의 웅장한 형상입니다. 스케일이 장대하고 이상이 높으며, 강력한 권력욕과 명예욕을 지녔습니다. 한 번 목표를 정하면 앞만 보고 달려가는 무서운 추진력과 리더십을 발휘해 큰 성공을 거둘 잠재력이 큽니다. 독립심이 투철하여 남의 밑에 있기를 싫어하고 간섭받는 것을 극도로 꺼립니다. 겉으로는 위풍당당하나, 속으로는 남모를 외로움과 고민을 안고 있습니다.', shinsal: ['학당귀인', '지살', '관성', '태극귀인'] },
            '기묘': { trait: '봄날의 들판을 깡충깡충 뛰어다니는 토끼나, 작고 예쁜 화분에 심어진 풀의 형상입니다. 대단히 예민하고 감각이 섬세하며 눈치가 빨라, 어떤 환경에 던져져도 빠르게 상황 파악하고 적응해 냅니다. 타인에 대한 배려심이 깊고 사람들과 원만하게 어울리지만, 속으로는 주변의 시선을 몹시 신경 쓰며 스트레스를 잘 받습니다. 신경이 예민하여 쉽게 피로를 느끼고 변덕을 부릴 수 있으니 마음의 안정을 찾는 훈련이 필요합니다.', shinsal: ['구추방해', '철사관', '태극귀인', '비인살'] },
            '경진': { trait: '단단한 바위로 이루어진 거대한 산이나, 무기를 들고 전쟁터에 나서는 위풍당당한 장수의 형상입니다. 엄청난 스케일과 강인한 기백을 지녔으며, 어떤 시련 앞에서도 굽히지 않는 강력한 카리스마와 추진력을 뿜어냅니다. 두뇌가 총명하고 결단력이 확고하여 무리의 우두머리가 되거나 큰 권력을 쥘 수 있습니다. 그러나 고집이 태산 같고 성격이 무뚝뚝하여 대인관계에서 강압적인 인상을 주거나 큰 충돌을 일으킬 수 있습니다.', shinsal: ['괴강살', '백호대살', '수관', '십악대패'] },
            '신사': { trait: '뜨거운 불 속에 들어가 자신을 아름답게 다듬고 있는 예리한 보석(또는 흰 뱀)의 형상입니다. 외모가 깔끔하고 단정하며 정교하고 날카로운 판단력을 지녔습니다. 영감과 직관력이 매우 뛰어나 상대의 속마음을 단번에 꿰뚫어 보는 능력이 있습니다. 완벽주의 성향이 강해 스스로를 피곤하게 다그치고 타인에게도 엄격한 잣대를 들이대기 쉽습니다. 시련을 겪을수록 더욱 빛나는 그릇이 되는 대기만성의 기운을 품고 있습니다.', shinsal: ['십악대패', '지살', '천문성', '태극귀인'] },
            '임오': { trait: '캄캄한 호수 위에 떠 있는 환한 달빛이나, 강물을 거슬러 올라가는 검은 말의 형상입니다. 수완이 대단히 좋고 사교적이며 언변이 뛰어나 어느 모임에서나 인기를 독차지합니다. 임기응변에 강해 어떤 위기 상황도 능구렁이처럼 부드럽게 잘 빠져나갑니다. 지혜롭고 다정다감하지만, 속마음을 좀처럼 드러내지 않고 물밑에서 치밀하게 계산하는 이중적인 면모가 있으며 재물과 이성에 대한 호기심이 매우 강합니다.', shinsal: ['녹마동향', '수옥살', '탕화살', '비인살', '태극귀인'] },
            '계미': { trait: '뜨겁고 메마른 한여름의 대지 위를 적셔주는 단비의 형상입니다. 환경이 아무리 척박하고 고통스러워도 이를 묵묵히 견뎌내는 초인적인 인내력과 강인한 생명력을 지녔습니다. 겉보기엔 매우 차분하고 조용해 보이지만 내면에는 뜨거운 열정과 대단한 고집이 숨겨져 있습니다. 남을 위해 봉사하고 희생하는 정신이 투철하여 종교나 교육 분야에 잘 맞으나, 속을 알 수 없는 비밀스러운 성격 탓에 주변 사람들이 답답해할 수 있습니다.', shinsal: ['비인살', '과숙살', '태극귀인', '복성귀인'] },
            '갑신': { trait: '단단하고 날카로운 바위산 위에 위태롭게 뿌리를 내린 거목(또는 나무를 타는 원숭이)의 형상입니다. 상황 판단이 대단히 빠르고 맺고 끊는 결단력이 확실하며, 다재다능한 팔방미인 기질을 타고났습니다. 명예를 중시하고 의리가 있지만, 자리가 위태롭고 불안정하여 감정 기복이 심하고 신경이 날카롭습니다. 한곳에 오래 머물지 못하고 직업이나 환경의 변화를 자주 겪을 수 있으나, 위기를 기회로 바꾸는 순발력은 타의 추종을 불허합니다.', shinsal: ['절단살', '현침살', '역마살', '십악대패', '태극귀인'] },
            '을유': { trait: '날카로운 칼날이나 뾰족한 바위 위에 핀 가녀린 화초의 형상입니다. 대단히 예민하고 감각이 섬세하며, 아름다움을 추구하는 심미안과 예술적 감각이 매우 탁월합니다. 겉은 부드럽지만 속은 예리한 칼을 품고 있어, 한 번 결심하면 피도 눈물도 없이 냉정하게 맺고 끊는 결단력이 있습니다. 신경이 몹시 날카로워 스스로 스트레스를 자초하며 뼈나 관절 부위의 건강에 각별히 유의해야 하는 숙제를 지니고 있습니다.', shinsal: ['곡각살', '현침살', '태극귀인', '절단살'] },
            '병술': { trait: '하루를 마감하고 서산 너머로 지는 쓸쓸하면서도 붉고 장엄한 저녁 노을(또는 불을 품은 개)의 형상입니다. 예의를 중시하고 불의를 보면 참지 못하는 대단히 강직하고 의리 있는 성품입니다. 평소에는 명랑하고 활발해 보이지만, 마음속 깊은 곳에는 원인 모를 고독과 쓸쓸함, 우울감을 간직하고 있습니다. 감정 기복이 극단적일 때 폭발하는 기운이 무서우며, 철학, 종교, 학문에 남다른 통찰력을 보여주는 기운입니다.', shinsal: ['백호대살', '평두살', '화개살', '태극귀인'] },
            '정해': { trait: '어두운 호수 위에 반짝이는 맑은 별빛이나, 밤바다를 비추는 등대의 형상입니다. 귀인들의 보이지 않는 도움을 잘 받으며, 마음이 유리알처럼 맑고 온화해 누구에게나 다정다감합니다. 직감력, 예지력, 영감이 타의 추종을 불허할 정도로 발달하여 철학, 예술, 역학 등에 천부적인 재능을 보입니다. 그러나 심성이 너무 여리고 예민하여 상처를 잘 받고 우울감에 빠지기 쉬우니 긍정적이고 활동적인 자세를 잃지 말아야 합니다.', shinsal: ['천을귀인', '십악대패', '천문성', '태극귀인'] },
            '무자': { trait: '깊고 험준한 산속에 맑은 물이 고여 있는 호수(또는 흙에 덮인 쥐)의 형상입니다. 겉보기엔 점잖고 우직하며 무뚝뚝해 보이지만, 속으로는 치밀한 계산과 뛰어난 현실 감각을 지녀 재물을 모으고 관리하는 능력이 아주 탁월합니다. 책임감이 강해 묵묵히 자신의 소임을 다하지만, 속마음을 좀처럼 드러내지 않아 엉큼하거나 비밀이 많다는 오해를 사기도 합니다. 한번 축적한 부를 잘 지켜내는 안정적인 재물운을 자랑합니다.', shinsal: ['비인살', '재고', '태극귀인', '교신살'] },
            '기축': { trait: '한겨울 꽁꽁 얼어붙은 진흙탕이나 눈이 덮인 쓸쓸한 논밭(또는 밭을 가는 소)의 형상입니다. 고집과 끈기가 엄청나서 남들이 모두 포기하는 일조차 끝끝내 해내는 초인적인 성실함과 인내심을 가졌습니다. 어떤 시련이 와도 묵묵히 일하며 재물을 모으는 능력이 있어 전형적인 대기만성형 인물입니다. 그러나 아집이 너무 강해 융통성이 부족하고, 차가운 기운 탓에 내면의 우울증과 위장 질환 등 건강 관리에 늘 신경 써야 합니다.', shinsal: ['곡각살', '비인살', '태극귀인'] },
            '경인': { trait: '험준한 바위산 위를 호령하는 맹맹하고 역동적인 백호의 형상입니다. 불의와 타협하지 않는 강건한 기풍과 한 번 결정하면 밀어붙이는 무서운 추진력을 가졌습니다. 스케일이 매우 크고 활동 반경이 넓어 가만히 있지 못하며, 역마의 기운으로 변화와 도전을 즐깁니다. 리더십이 출중하여 큰 사업이나 권력을 쥐는 데 유리하지만, 성질이 급하고 맺고 끊음이 지나치게 날카로워 대인관계에서 큰 마찰을 겪기 쉽습니다.', shinsal: ['지살', '절단살', '태극귀인', '수옥살'] },
            '신묘': { trait: '예쁘게 가꿔진 화초를 날카롭게 다듬는 가위나 보석으로 장식된 칼(또는 흰 토끼)의 형상입니다. 대단히 예민한 감수성과 타고난 미적 감각, 예술성을 지녀 아름다운 것을 감별하고 꾸미는 재주가 탁월합니다. 성격이 깔끔하고 꼼꼼하며 치밀하지만, 호불호가 너무 명확하고 신경이 곤두서 있어 타인에게 예리한 말로 상처를 잘 줍니다. 부지런히 움직여 실속을 챙기나, 심리적인 불안정감과 예민함을 다스리는 것이 관건입니다.', shinsal: ['현침살', '구추방해', '태극귀인', '교신살'] },
            '임진': { trait: '거대한 물을 넉넉히 품고 있는 장대한 산이나 하늘로 승천하려는 흑룡의 형상입니다. 스케일이 타의 추종을 불허할 만큼 크고, 강한 통솔력과 굽히지 않는 카리스마로 무리를 호령하는 우두머리 기질을 타고났습니다. 속내를 전혀 알 수 없는 포커페이스의 달인이며, 목표를 향해 무섭게 돌진하는 뚝심이 있습니다. 그러나 이상이 지나치게 높아 현실과 타협하지 않고 아집을 부리다 큰 시련을 자초할 수 있으니 겸손함이 필요합니다.', shinsal: ['괴강살', '백호대살', '수관', '평두살', '퇴신'] },
            '계사': { trait: '따뜻한 아침 햇살을 받아 영롱하게 빛나는 이슬이나 무지개(또는 비 내리는 뱀)의 형상입니다. 일생 동안 보이지 않는 귀인의 도움을 받아 위기를 모면하고 복을 누리는 천을귀인의 상징입니다. 두뇌가 몹시 명석하고 수단과 요령이 좋으며, 부드러운 언변과 지혜로 사람들의 마음을 잘 사로잡습니다. 다양한 분야에 재능을 보이지만, 변덕이 심하고 한 곳에 진득하게 집중하지 못해 겉핥기에 그칠 우려가 있으니 뒷심을 길러야 합니다.', shinsal: ['천을귀인', '지살', '태극귀인', '퇴신'] },
            '갑오': { trait: '활활 타오르는 불길 속에 장작으로 쓰이는 나무(또는 질주하는 청마)의 형상입니다. 자신을 불태워 빛을 내듯 열정이 엄청나고 자신을 표현하고 드러내기를 무척 좋아합니다. 다재다능하고 두뇌가 비상하며 말솜씨가 화려해 타인의 시선을 끄는 매력이 넘칩니다. 그러나 감정 기복이 극심하고 인내심이 부족하여 욱하는 성질을 부리거나 화려함에 취해 실속을 놓치기 쉽으니 차분함과 끈기를 보완하는 것이 중요합니다.', shinsal: ['홍염살', '현침살', '탕화살', '태극귀인'] },
            '을미': { trait: '건조하고 뜨거운 모래땅 위에서 끈질기게 꽃을 피워내는 들풀이나 선인장의 형상입니다. 어떤 악조건 속에서도 결코 꺾이지 않는 무서운 생명력과 초인적인 인내심을 타고났습니다. 겉보기엔 한없이 부드럽고 약해 보이지만, 마음을 먹으면 고집이 황소 같아 누구의 말도 듣지 않는 외유내강형의 끝판왕입니다. 성실하게 노력하여 자수성가하는 타입이나, 메마른 기운 탓에 내면의 외로움과 신경성 위장 질환에 유의해야 합니다.', shinsal: ['백호대살', '곡각살', '십악대패', '태극귀인'] },
            '병신': { trait: '찬란한 가을 태양 아래 빛나는 큰 바위나 제련된 철광석의 형상입니다. 두뇌가 굉장히 명석하고 이치에 밝으며, 다방면에 뛰어난 재주를 겸비해 어떤 상황에서도 실속 있게 이익을 창출해 냅니다. 역마의 기운이 강해 호기심이 많고 밖으로 활발하게 돌아다니길 좋아합니다. 그러나 지나치게 다재다능하여 한 우물을 파기보다는 이것저것 손대다 용두사미가 될 수 있으며, 감정 기복과 잘난 척하는 태도를 경계해야 합니다.', shinsal: ['문창귀인', '역마살', '현침살', '태극귀인'] },
            '정유': { trait: '캄캄한 밤하늘의 별빛을 받아 아름답게 반짝이는 보석이나 조명의 형상입니다. 성품이 대단히 섬세하고 야무지며, 미적 감각과 예술적 안목이 타고나 자신을 꾸미거나 아름다운 것을 감상하는 능력이 출중합니다. 완벽주의 성향으로 매사를 꼼꼼히 처리하고 금전 감각도 뛰어나 실속을 챙깁니다. 다정하고 인정이 많으나 예민하고 날카로운 기질이 있어, 자신도 모르게 날 선 말로 상대에게 상처를 주는 단점을 고쳐야 합니다.', shinsal: ['천을귀인', '학당귀인', '도화살', '태극귀인', '철사관'] },
            '무술': { trait: '거대한 흙산 위에 또 흙산이 겹겹이 쌓인 장엄하고 굳건한 형상입니다. 그 어떤 시련이 와도 산처럼 흔들리지 않는 엄청난 듬직함과 무거운 뚝심을 자랑합니다. 한 번 믿음을 준 사람과는 끝까지 의리를 지키며, 자기 주관이 무서울 정도로 확고합니다. 그러나 고집불통 중의 고집불통이라 타인과 타협을 모르고 융통성이 몹시 떨어져 꽉 막힌 사람이라는 소리를 듣기 쉽습니다. 종교나 철학 등 깊이 있는 정신세계와 인연이 깊습니다.', shinsal: ['괴강살', '백호대살', '태극귀인'] },
            '기해': { trait: '촉촉하게 물을 흠뻑 머금고 있는 비옥한 진흙이나 강가의 논밭 형상입니다. 겉보기엔 부드럽고 유연하여 누구와도 잘 어울리며, 어떤 환경에서도 물 흐르듯 자연스럽게 대처하는 훌륭한 처세술을 지녔습니다. 꼼꼼하고 사려 깊게 일 처리를 하며 재물복(재물 창고)도 좋습니다. 다만 겉과 달리 내면의 비밀과 고뇌를 꽁꽁 숨기고 있어 속을 알 수 없다는 평가를 받으며, 다소 의심이 많고 이성 문제나 질투에 휘말리기 쉽습니다.', shinsal: ['천을귀인', '지살', '의처의부', '태극귀인'] },
            '경자': { trait: '차가운 금속 바위 아래로 맑고 차가운 물이 힘차게 흐르는 형상입니다. 두뇌 회전이 얼음물처럼 차갑고 맑고 대단히 빠르며, 상황을 분석하고 비판하는 예리함이 타의 추종을 불허합니다. 의리가 있고 맺고 끊음이 무 자르듯 확실하지만, 지나치게 냉정하고 차가운 성격 탓에 타인에게 매몰차다는 인상을 줍니다. 언변이 좋고 뛰어난 재능을 발휘하나 자기중심적이고 반항적인 기질을 다스려야 구설을 피할 수 있습니다.', shinsal: ['상관살', '도화살', '태극귀인'] },
            '신축': { trait: '꽁꽁 얼어붙은 차가운 땅 속에 파묻혀 빛을 보지 못한 보석의 형상입니다. 성격이 극도로 예민하고 꼼꼼하며, 자신이 맡은 일은 끝까지 완벽하게 해내려는 엄청난 집념과 끈기를 가졌습니다. 남에게 지기 싫어하는 강한 자존심을 숨기고 있으며, 한번 앙심을 품으면 오래 담아두는 뒤끝이 있습니다. 시련과 억압을 견뎌내고 결국 큰 성공을 이루는 대기만성의 명이지만, 만성적인 우울감과 신경성 질환, 위장병을 늘 조심해야 합니다.', shinsal: ['곡각살', '비인살', '탕화살', '효신살'] },
            '임인': { trait: '깊은 강물가에서 힘차게 포효하는 늠름한 흑호랑이의 형상입니다. 지혜의 상징인 물과 생동감 넘치는 호랑이가 만나 두뇌가 비상하고 창의력이 뛰어나며, 달변가로서 다방면에서 큰 능력을 발휘합니다. 호기심이 많고 배움의 열정이 뜨거워 교육이나 연구 분야에서 대성하기 좋습니다. 활동적이고 긍정적이며 베풀기를 좋아하는 따뜻한 마음을 지녔지만, 때론 성질이 불같이 급해지거나 일을 벌이기만 하고 마무리가 약할 수 있습니다.', shinsal: ['문창귀인', '학당귀인', '지살', '암록'] },
            '계묘': { trait: '봄날의 메마른 대지와 새싹을 촉촉하게 적셔주는 단비나 맑은 시냇물의 형상입니다. 천성이 매우 착하고 다정다감하며, 타인을 세심하게 배려하고 돌보는 헌신적인 마음씨를 가졌습니다. 평생 먹을 복과 귀인의 도움이 끊이지 않는 복 받은 기운으로 미적 감각과 예술성도 뛰어납니다. 온화하고 대인관계가 좋지만 귀가 얇아 남의 말에 잘 흔들리며, 어려운 상황을 마주하면 우유부단하게 회피하려는 연약함이 단점입니다.', shinsal: ['천을귀인', '학당귀인', '식신', '태극귀인'] },
            '갑진': { trait: '비옥하고 촉촉한 봄의 대지 위로 강하게 뿌리를 내리고 자라나는 장대한 숲의 형상입니다. 이상과 목표가 매우 높고 독립심이 강하며, 어떤 고난과 장애물도 엄청난 뚝심과 추진력으로 밀어붙여 끝내 돌파해 내는 저력이 있습니다. 재물을 향한 집념이 대단히 강하고 자립심이 투철하여 자수성가형 리더에 적합합니다. 자존심이 하늘을 찌르고 은근히 타인을 무시하는 독단적인 기질이 있어 마찰을 빚기 쉬우니 하심(下心)이 필요합니다.', shinsal: ['백호대살', '금여', '과숙살', '평두살'] },
            '을사': { trait: '초여름 화사하게 만발한 꽃밭에서 유연하게 움직이는 뱀의 형상입니다. 예술적 감각이 뛰어나고 겉모습을 아름답게 꾸미기를 좋아하며, 화려한 표현력과 매끄러운 언변을 앞세워 다방면에서 눈부신 재능을 발휘합니다. 사교적이고 활동 반경이 넓어 외교, 방송, 예능에 소질이 있습니다. 눈치가 빠르고 실속을 잘 챙기지만, 감정 기복이 다소 심하고 인내심과 끈기가 부족해 용두사미로 끝나는 경향을 의식적으로 고쳐야 합니다.', shinsal: ['곡각살', '지살', '고란살', '십악대패'] },
            '병오': { trait: '한여름 한가운데 가장 높이 떠서 세상의 모든 것을 태워버릴 듯 작열하는 태양(또는 붉은 말)의 형상입니다. 누구도 막을 수 없는 폭발적인 에너지와 불굴의 추진력, 그리고 주변을 압도하는 강력한 카리스마와 권위 의식을 타고났습니다. 명랑하고 불의를 참지 못하며 솔직하고 뒤끝이 없으나, 자존심이 상하면 불같이 화를 내어 모든 것을 엎어버리는 극단성이 무섭습니다. 꺾일 줄 모르는 고집을 다스리고 타인과 타협하는 법을 배워야 합니다.', shinsal: ['양인살', '양착살', '탕화살', '수옥살'] },
            '정미': { trait: '한여름 가장 뜨거운 열기를 품고 있는 건조한 흙이나 활활 타오르는 화로의 형상입니다. 겉보기엔 한없이 조용하고 온화해 보이지만, 마음속에는 누구보다 뜨거운 열정과 집념, 그리고 엄청난 끈기를 숨기고 있는 외유내강의 표본입니다. 어떤 역경도 묵묵히 버텨내며 자신의 목표를 이루는 근성이 돋보입니다. 감정을 속으로 삼키고 참다가 한 번 터지면 걷잡을 수 없으며, 다소 욱하는 성질과 고집스러움을 융통성으로 보완해야 합니다.', shinsal: ['음양살', '비인살', '홍염살', '관성'] },
            '무신': { trait: '거대한 바위산에 단단히 박혀 있는 철광석이나 기민한 원숭이의 형상입니다. 호기심이 무척 많고 두뇌가 명석하여, 한 번 본 것은 금세 따라 하는 다재다능한 능력을 갖추고 있습니다. 스케일이 크고 배포가 넓으며 활동 반경이 커서 타향이나 외국에서 대성할 수 있습니다. 수단과 요령이 좋아 큰 재물을 다루는 데 능하지만, 너무 많은 일에 참견하다 실속을 잃기 쉽고 쓸데없는 허세나 자만심을 부리다 구설에 오를 수 있습니다.', shinsal: ['문창귀인', '지살', '고란살', '태극귀인'] },
            '기유': { trait: '정교하게 가공된 보석을 고이 품고 있는 기름진 땅이나 아름다운 화분의 형상입니다. 손재주가 타의 추종을 불허할 정도로 뛰어나며, 매사를 완벽하고 깔끔하게 처리하려는 정밀한 안목과 비판력을 지녔습니다. 성품이 순수하고 미적 감각이 돋보여 요리, 미용, 설계 등 세밀한 분야에 아주 잘 맞습니다. 다만 지나친 완벽주의와 예리한 비판으로 주변 사람을 피곤하게 만들거나 자신도 뼈, 관절 계통의 건강을 잃기 쉬우니 여유가 필요합니다.', shinsal: ['문창귀인', '장성살', '현침살', '태극귀인'] },
            '경술': { trait: '거칠고 메마른 흙산 위를 지키고 선 무쇠나 늠름한 바위의 형상입니다. 의리가 깊고 강건한 기풍을 지녔으며, 한 번 결심한 일은 주변의 시선에 아랑곳하지 않고 밀어붙이는 무서운 결단력과 용기를 보여줍니다. 리더십이 뛰어나 무리를 호령하는 일에 어울리며, 한 번 내 편이라 여긴 사람은 목숨을 걸고 지킵니다. 하지만 타인과 타협을 모르고 너무 강압적이고 거친 성향 탓에 마찰이 심하고 외롭고 고독한 삶을 자초할 수 있습니다.', shinsal: ['괴강살', '금여', '홍염살', '태극귀인'] },
            '신해': { trait: '맑고 차가운 깊은 물 속에 가라앉아 깨끗하게 씻기고 있는 보석의 형상입니다. 지혜가 무궁무진하고 두뇌 회전이 대단히 빠르며, 사물을 꿰뚫어 보는 날카로운 통찰력과 직관력을 겸비했습니다. 미적 감각이 탁월해 자신을 아름답게 꾸미는 것을 좋아합니다. 자존심이 대단히 강하고 깐깐하여 남의 밑에 있기를 극도로 싫어하고 결벽증적 성향이 강합니다. 차가운 언행으로 오해를 사고 스스로 고립될 수 있으니 따뜻한 마음을 길러야 합니다.', shinsal: ['금여', '고란살', '십악대패', '태극귀인'] },
            '임자': { trait: '끝이 보이지 않는 깊고 거대한 바다나 한겨울 얼음물의 형상입니다. 스케일이 무한히 크고 만물을 감싸 안는 넓은 포용력을 가졌지만, 그만큼 속내를 전혀 알 수 없어 대단히 비밀스럽고 기분파적인 기질이 다분합니다. 남에게 절대 지기 싫어하는 강렬한 승부욕과 투쟁심을 겉으로 숨긴 채 치밀하게 기회를 노립니다. 평소에는 잔잔하나 화가 나면 쓰나미처럼 모든 것을 삼켜버리는 파괴력이 있어 스스로의 감정 폭발을 조심해야 합니다.', shinsal: ['양인살', '홍염살', '도화살', '태극귀인'] },
            '계축': { trait: '언 땅에 내리는 진눈깨비나 꽁꽁 얼어붙은 겨울철 시냇물의 형상입니다. 겉보기엔 한없이 조용하고 순응하는 듯하지만, 시련과 고통을 속으로 삭이며 목표를 향해 묵묵히 버텨내는 뚝심과 인내심이 초인적입니다. 어떤 악조건 속에서도 흔들리지 않는 집념이 있으나, 차갑고 어두운 기운 탓에 내면의 우울증과 원인 모를 고뇌에 시달리기 쉽습니다. 비밀이 많고 융통성이 떨어져 속앓이를 하니 속마음을 털어놓는 소통이 필수적입니다.', shinsal: ['백호대살', '탕화살', '비인살', '백호'] },
            '갑인': { trait: '하늘을 찌를 듯 웅장하게 솟아오른 큰 숲이자, 한겨울을 이겨내고 거목으로 성장한 강직한 소나무의 형상입니다. 자립심과 독립심이 태산 같고, 자기 주관이 확고해 남에게 의지하거나 타협하는 법을 모릅니다. 곧은 성품과 당당한 기백으로 리더의 역할을 훌륭히 수행하며 불의를 용납하지 않습니다. 그러나 지나치게 곧아 부러지기 쉽고 남의 조언을 듣지 않는 불통의 아이콘이 될 수 있으니, 자신을 굽히고 타인과 조화를 이루는 법을 배워야 합니다.', shinsal: ['건록', '학당귀인', '고란살', '간여지동'] },
            '을묘': { trait: '봄기운을 받아 들판에 무성하게 얽히고설킨 넝쿨이나 풀밭의 형상입니다. 겉보기엔 가녀리고 유연하여 주변 환경에 잘 맞춰 처세술을 발휘하지만, 밟혀도 다시 일어나는 끈질긴 생명력과 꺾이지 않는 강인한 자아를 내면에 숨기고 있습니다. 사교적이고 부드러워 사람들을 잘 다루지만, 은근한 고집과 집착이 엄청나 한번 마음먹은 것은 절대 포기하지 않습니다. 신경이 예민하여 타인의 평가에 지나치게 얽매이는 점을 다스려야 합니다.', shinsal: ['건록', '현침살', '간여지동', '태극귀인'] },
            '병진': { trait: '만물이 쑥쑥 자라나는 따뜻하고 습한 봄의 대지 위를 포근하게 비추는 태양의 형상입니다. 성격이 매우 명랑하고 화사하며, 친화력이 뛰어나 누구와도 잘 어울리고 남에게 베풀기를 즐깁니다. 화술이 좋고 임기응변에 강해 다방면에서 재주를 인정받으며, 일의 스케일을 크게 벌이는 것을 좋아합니다. 하지만 겉치레와 허영심이 있어 분수에 넘치는 일을 벌이다 손해를 볼 수 있고, 인내심이 다소 부족해 용두사미의 결과를 주의해야 합니다.', shinsal: ['평두살', '화개살', '퇴신', '관성'] },
            '정사': { trait: '한여름 맹렬하게 타오르는 용광로나 뜨거운 화산재(또는 붉은 뱀)의 형상입니다. 열정과 에너지가 철철 넘쳐 활동 반경이 넓으며, 감정 표현에 가식과 거짓이 없는 극도로 솔직하고 시원시원한 성품을 지녔습니다. 두뇌가 명석하고 화술이 뛰어나 사람들을 이끄는 마력과 뚝심이 대단합니다. 그러나 성질이 용광로처럼 급하고 자기주장이 너무 세서 타인과 대립하기 쉽고, 감정 폭발을 억누르지 못해 일을 그르칠 위험이 늘 도사리고 있습니다.', shinsal: ['고란살', '음양살', '역마살', '간여지동'] },

                    if (isC) {
                        // 천간이 바뀌어 지지의 음양이 안 맞으면, 같은 음양의 첫 번째 지지로 자동 변경
                        state.sajuInput[pairedSlot] = jijiData.find(j => j.yinyang === data.yinyang);
                    } else {
                        // 지지가 바뀌어 천간의 음양이 안 맞으면, 같은 음양의 첫 번째 천간으로 자동 변경
                        state.sajuInput[pairedSlot] = cheonganData.find(c => c.yinyang === data.yinyang);
                    }
                }

                state.selectingSlot = null; // 선택 후 닫기
                renderApp();
            }
        };

        // 미니 노드 렌더링 (기존)
        function renderMiniNode(koreanName, isCheongan) {
            if (!koreanName || koreanName === '없음') {

            const data = isCheongan ? cheonganData.find(d => d.korean === koreanName) : jijiData.find(d => d.korean === koreanName);
            if (!data) return '';

                    <span class="text-xl md:text-2xl font-bold ${colors.text}">${data.hanja}</span>
                    <span class="text-[10px] md:text-xs font-semibold text-neutral-700">${data.korean}</span>
                </button>
            `;
        }

        // 기존 십성 계산기 1
        function getSipseong(stem, branch) {
            const sIdx = elementsArray.indexOf(stem.element);
            const bIdx = elementsArray.indexOf(branch.element);
            const sYinYang = stem.yinyang;
            const bYinYangReal = jijiYongYinYang[branch.korean]; 
            const isSameYinYang = (sYinYang === bYinYangReal);
            let name = '';
            let sElement = stem.element.replace(/[^가-힣]/g, '');
            let bElement = branch.element.replace(/[^가-힣]/g, '');
            let reasonDesc = '';
            let yongExplain = isSameYinYang ? '같아' : '달라';

            if (branch.yinyang !== bYinYangReal) {
                reasonDesc += `<span class="block text-xs text-indigo-500 mb-1.5 bg-white px-2 py-1 border border-indigo-100 rounded inline-block">※ 참고: '${branch.korean}'는 명목상 ${branch.yinyang}이지만 십성(본기)은 <b>${bYinYangReal}</b>으로 봅니다.</span><br/>`;
            }

            if (sIdx === bIdx) {
                name = isSameYinYang ? '비견(比肩)' : '겁재(劫財)';
                reasonDesc += `천간과 지지가 같은 <b>${sElement}</b> 오행이며, 음양이 서로 ${yongExplain} <strong>${name}</strong>이 됩니다.`;
            } else if ((sIdx + 1) % 5 === bIdx) {
                name = isSameYinYang ? '식신(食神)' : '상관(傷官)';
                reasonDesc += `천간(${sElement})이 지지(${bElement})를 <b>생(生)</b>해주고(내가 낳음), 음양이 서로 ${yongExplain} <strong>${name}</strong>이 됩니다.`;
            } else if ((sIdx + 2) % 5 === bIdx) {
                name = isSameYinYang ? '편재(偏財)' : '정재(正財)';
                reasonDesc += `천간(${sElement})이 지지(${bElement})를 <b>극(剋)</b>하여(내가 통제함), 음양이 서로 ${yongExplain} <strong>${name}</strong>이 됩니다.`;
            } else if ((sIdx + 3) % 5 === bIdx) {
                name = isSameYinYang ? '편관(偏官)' : '정관(正官)';
                reasonDesc += `지지(${bElement})가 천간(${sElement})을 <b>극(剋)</b>하여(나를 통제함), 음양이 서로 ${yongExplain} <strong>${name}</strong>이 됩니다.`;
            } else if ((sIdx + 4) % 5 === bIdx) {
                name = isSameYinYang ? '편인(偏印)' : '정인(正印)';
                reasonDesc += `지지(${bElement})가 천간(${sElement})을 <b>생(生)</b>해주고(나를 낳음), 음양이 서로 ${yongExplain} <strong>${name}</strong>이 됩니다.`;
            }

            const pureName = name.split('(')[0];
            return { name: name, desc: reasonDesc, meaning: sipseongDict[pureName] };
        }

        // 범용 십성 계산기 (이름만 반환)
        function getSipseongGeneric(baseStem, targetObj, isTargetJiji) {
            const sIdx = elementsArray.indexOf(baseStem.element);
            const tIdx = elementsArray.indexOf(targetObj.element);
            
            let tYinYang = targetObj.yinyang;
            if (isTargetJiji) {
                tYinYang = jijiYongYinYang[targetObj.korean];
            }
            const isYinYangMatch = baseStem.yinyang === tYinYang;
            const diff = (tIdx - sIdx + 5) % 5;
            
            let name = '';
            if (diff === 0) name = isYinYangMatch ? '비견' : '겁재';
            if (diff === 1) name = isYinYangMatch ? '식신' : '상관';
            if (diff === 2) name = isYinYangMatch ? '편재' : '정재';
            if (diff === 3) name = isYinYangMatch ? '편관' : '정관';
            if (diff === 4) name = isYinYangMatch ? '편인' : '정인';

            return name;
        }

        /* ==========================================
           새로 추가된 성격 알고리즘 계산 함수
        ========================================== */
        
        function calculatePersonality(saju) {
            const dayMaster = saju.dayC; // 일간 (기준)
            const pillars = [
                { obj: saju.yearC, isJiji: false, weight: 1 },
                { obj: saju.yearJ, isJiji: true, weight: 1 },
                { obj: saju.monthC, isJiji: false, weight: 1 },
                { obj: saju.monthJ, isJiji: true, weight: 3 }, // 월지는 환경적 요인이 가장 강하므로 3배 가중치
                { obj: saju.dayC, isJiji: false, weight: 1 }, // 일간 본인
                { obj: saju.dayJ, isJiji: true, weight: 1.5 }, // 일지는 배우자/내면 자리로 약간 가중치
                { obj: saju.hourC, isJiji: false, weight: 1 },
                { obj: saju.hourJ, isJiji: true, weight: 1.5 },
            ];

            let groupScores = { '비겁': 0, '식상': 0, '재성': 0, '관성': 0, '인성': 0 };
            let sipseongList = []; // 존재하는 십성 목록 (화학반응용)
            let johooScore = 0; // 양수: 조열(화/건토), 음수: 한습(수/습토)

            pillars.forEach((p, idx) => {
                // 1. 십성 그룹 계산 (일간 본인은 비견으로 간주)
                let sipseongName = '';
                if (idx === 4) { // 일간
                    sipseongName = '비견'; 
                } else {
                    sipseongName = getSipseongGeneric(dayMaster, p.obj, p.isJiji);
                }
                
                sipseongList.push(sipseongName);
                
                let group = '';
                if (['비견', '겁재'].includes(sipseongName)) group = '비겁';
                if (['식신', '상관'].includes(sipseongName)) group = '식상';
                if (['편재', '정재'].includes(sipseongName)) group = '재성';
                if (['편관', '정관'].includes(sipseongName)) group = '관성';
                if (['편인', '정인'].includes(sipseongName)) group = '인성';
                
                groupScores[group] += p.weight;

                // 2. 조후 계산
                const el = p.obj.element;
                const kr = p.obj.korean;
                if (el === '화(火)') johooScore += p.weight;
                if (el === '수(水)') johooScore -= p.weight;
                if (['무', '술', '미'].includes(kr)) johooScore += p.weight * 0.8; // 조토(건조)
                if (['기', '진', '축'].includes(kr)) johooScore -= p.weight * 0.8; // 습토(습기)
            });

            // 점수순 정렬
            let sortedGroups = Object.entries(groupScores).sort((a, b) => b[1] - a[1]);
            let totalWeight = Object.values(groupScores).reduce((a, b) => a + b, 0);

            // 화학 반응(특수 성격) 체크
            let chemistries = [];
            if (sipseongList.includes('식신') && sipseongList.includes('편인')) {
                chemistries.push({ name: '도식(倒食)', desc: '번뜩이는 아이디어(식신)는 많으나, 실행 단계에서 생각(편인)이 너무 많아 주저하거나 엎어질 수 있습니다.' });
            }
            if (sipseongList.includes('상관') && sipseongList.includes('정관')) {
                chemistries.push({ name: '상관견관(傷官見官)', desc: '불합리한 틀이나 규칙(정관)을 깨고 싶어 하는 혁신가적 기질(상관)이 발동합니다. 조직 내에서 트러블메이커가 될 수도, 개혁가가 될 수도 있습니다.' });
            }
            if ((sipseongList.includes('편재') || sipseongList.includes('정재')) && (sipseongList.includes('편관') || sipseongList.includes('정관'))) {
                chemistries.push({ name: '재생관(財生官)', desc: '목표 달성 욕구(재성)와 책임감(관성)이 결합되어, 조직에서 무섭게 인정받는 워커홀릭 성향이 강하게 나타납니다.' });
            }
            if ((sipseongList.includes('비견') || sipseongList.includes('겁재')) && (sipseongList.includes('편재') || sipseongList.includes('정재')) && groupScores['비겁'] > groupScores['재성']) {
                chemistries.push({ name: '군겁쟁재(群劫爭財)', desc: '경쟁심이 매우 강하고, 목표나 결과를 쟁취하기 위해 치열하게 다투거나 이익을 나누어야 하는 상황에 예민하게 반응합니다.' });
            }

            return {
                dayMaster: dayMaster,
                groupScores: groupScores,
                sortedGroups: sortedGroups,
                totalWeight: totalWeight,
                johooScore: johooScore,
                chemistries: chemistries
            };
        }

        function renderTimelineTab(comboCheongan, comboJiji, isComboValid, daewunCheongan, daewunJiji, selectedYear) {

            let dJijiGrid = jijiData.map(item => {

            const sewunObj = sewunList.find(y => y.year === selectedYear) || sewunList[2];

            const sewunJijiData = jijiData.find(j => j.korean === sewunObj.j);

            // 십성 계산
            const daewunCSipseong = getSipseongGeneric(comboCheongan, daewunCheongan, false);
            const daewunJSipseong = getSipseongGeneric(comboCheongan, daewunJiji, true);

                                    <div class="text-xs text-neutral-500 mb-1">천간 (정신적, 외부적 환경)</div>
                                    <div class="flex items-center gap-2 mb-2">
                                        <span class="text-sm font-bold text-white bg-slate-700 px-2 py-1 rounded">${daewunCSipseong}</span>
                                    </div>
                                    <div class="flex flex-wrap gap-1.5">
                                        ${keywordsD_C.map(k => `<span class="text-[11px] font-medium bg-slate-100 text-slate-700 px-2 py-0.5 rounded border border-slate-200">${k}</span>`).join('')}
                                    </div>
                                </div>

                                <div>
                                    <div class="text-xs text-neutral-500 mb-1">지지 (현실적, 내부적 환경)</div>
                                    <div class="flex items-center gap-2 mb-2">
                                        <span class="text-sm font-bold text-white bg-slate-700 px-2 py-1 rounded">${daewunJSipseong}</span>
                                        ${isDaewunGongmang ? `<span class="text-xs font-bold text-stone-600 bg-stone-100 border border-stone-400 border-dashed px-1.5 py-0.5 rounded shadow-sm">공망(空亡)</span>` : ''}
                                        ${isDaewunIpmyo ? `<span class="text-xs font-bold text-neutral-600 bg-neutral-200 border border-neutral-500 px-1.5 py-0.5 rounded shadow-sm">입묘(入墓)</span>` : ''}
                                    </div>
                                    <div class="flex flex-wrap gap-1.5">
                                        ${keywordsD_J.map(k => `<span class="text-[11px] font-medium bg-slate-100 text-slate-700 px-2 py-0.5 rounded border border-slate-200">${k}</span>`).join('')}
                                    </div>
                                </div>
                            </div>

                            <!-- 세운 분석 -->
                            <div class="bg-white rounded-lg p-5 border ${isSewunGongmang || isSewunIpmyo ? 'border-red-400 ring-2 ring-red-50' : 'border-violet-200 shadow-md ring-2 ring-violet-50'}">
                                <div class="flex items-center justify-between mb-4 pb-2 border-b border-violet-100">
                                    <h4 class="font-bold text-violet-700">세운 (당해 연도의 사건/결과)</h4>
                                    <span class="text-lg font-extrabold bg-violet-600 px-2 py-0.5 rounded text-white">${sewunCheonganData.hanja}${sewunJijiData.hanja}</span>
                                </div>
                                
                                <div class="mb-4">
                                    <div class="text-xs text-neutral-500 mb-1">당해 천간 (일어나는 사건의 명분)</div>
                                    <div class="flex items-center gap-2 mb-2">
                                        <span class="text-sm font-bold text-white bg-violet-600 px-2 py-1 rounded shadow-sm">${sewunCSipseong}</span>
                                    </div>
                                    <div class="flex flex-wrap gap-1.5">
                                        ${keywordsS_C.map(k => `<span class="text-[11px] font-medium bg-violet-50 text-violet-700 px-2 py-0.5 rounded border border-violet-200">${k}</span>`).join('')}
                                    </div>
                                </div>

                                <div>
                                    <div class="text-xs text-neutral-500 mb-1">당해 지지 (실질적인 체감/결과)</div>
                                    <div class="flex items-center gap-2 mb-2">
                                        <span class="text-sm font-bold text-white bg-violet-600 px-2 py-1 rounded shadow-sm">${sewunJSipseong}</span>
                                        ${isSewunGongmang ? `<span class="text-xs font-bold text-stone-600 bg-stone-100 border border-stone-400 border-dashed px-1.5 py-0.5 rounded shadow-sm">공망(空亡)</span>` : ''}
                                        ${isSewunIpmyo ? `<span class="text-xs font-bold text-neutral-600 bg-neutral-200 border border-neutral-500 px-1.5 py-0.5 rounded shadow-sm">입묘(入墓)</span>` : ''}
                                    </div>
                                    <div class="flex flex-wrap gap-1.5">
                                        ${keywordsS_J.map(k => `<span class="text-[11px] font-medium bg-violet-50 text-violet-700 px-2 py-0.5 rounded border border-violet-200">${k}</span>`).join('')}
                                    </div>
                                </div>
                            </div>

                            <!-- 공망/입묘 경고 문구 -->
                            ${(isDaewunGongmang || isSewunGongmang || isDaewunIpmyo || isSewunIpmyo) ? `
                                <div class="col-span-1 md:col-span-2 mt-2 bg-rose-50 border border-rose-200 rounded-lg p-4">
                                    <h4 class="text-sm font-bold text-rose-800 mb-3 flex items-center">
                                        <i data-lucide="alert-octagon" class="w-4 h-4 mr-1.5"></i> 주의가 필요한 운성 (공망 / 입묘)
                                    </h4>
                                    <ul class="text-sm text-rose-700 space-y-2 list-disc list-inside">
                                        ${isDaewunGongmang ? `<li><b>대운 공망:</b> 10년간의 환경이 공망에 들어 겉보기엔 화려해도 실속을 채우기 어려울 수 있으니 내실을 다져야 합니다.</li>` : ''}
                                        ${isSewunGongmang ? `<li><b>세운 공망:</b> 올해는 추진하는 일이 지연되거나 헛수고가 되기 쉬우니, 무리한 확장을 자제하고 현상 유지에 힘쓰는 것이 좋습니다.</li>` : ''}
                                        ${isDaewunIpmyo ? `<li><b>대운 입묘:</b> 10년간 일간(나)의 에너지가 창고에 갇히는 형국으로, 사회적 활동력이 위축되고 건강 관리에 유의해야 하는 시기입니다.</li>` : ''}
                                        ${isSewunIpmyo ? `<li><b>세운 입묘:</b> 올해는 활동이 정체되고 답답함을 느낄 수 있습니다. 새로운 도약보다는 휴식과 재충전, 학문에 집중하는 시기로 삼으세요.</li>` : ''}
                                    </ul>
                                </div>
                            ` : ''}

                        </div>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', renderApp);

    </script>
</body>
</html>
