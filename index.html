        /* ==========================================

        const cheonganData = [
            { id: 'gap', hanja: '甲', korean: '갑', element: '목(木)', yinyang: '양(+)', desc: '대림목(大林木)을 상징하는 거대한 나무입니다. 곧게 뻗어 오르는 기상이 강하며, 진취적이고 솔선수범하는 리더십을 지녔습니다. 불의를 참지 못하고 곧은 성품을 가져 학자, 교육자, 지도자로서의 자질이 탁월합니다.<br/><br/><span class="font-bold text-indigo-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>사주에 갑목이 있으면 기본적으로 우두머리 기질이 있어 남의 밑에 있기 힘들어합니다. 추진력이 좋아 새로운 일을 벌이는 데 능하지만, 타협을 몰라 인간관계에서 굽히지 않다 부러지는(실패하는) 경우가 많으니 유연성이 관건입니다.', abundanceDesc: '고집이 너무 세고 타협을 모르며, 뻣뻣하여 부러지거나 타인과 마찰이 잦을 수 있습니다.' },
            { id: 'eul', hanja: '乙', korean: '을', element: '목(木)', yinyang: '음(-)', desc: '초목(草木)을 상징하는 덩굴이나 화초입니다. 부드럽고 유연하며 환경 적응력이 대단히 뛰어납니다. 끈질긴 생명력으로 척박한 환경에서도 살아남으며, 타인과 어울리기를 좋아하고 사교적입니다. 내적 성숙과 심미안이 뛰어납니다.<br/><br/><span class="font-bold text-indigo-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>을목은 참을성이 강하고 실속을 잘 챙기며 끈질긴 생존력을 보입니다. 환경 적응력이 탁월해 어느 곳에서든 살아남지만, 주체성이 다소 약해 주변 환경이나 만나는 사람에 따라 인생의 굴곡이 크게 달라질 수 있습니다.', abundanceDesc: '줏대가 약해지고 이리저리 흔들리며, 잡초처럼 엉켜 일이 복잡해지거나 타인에게 지나치게 의존적이 될 수 있습니다.' },
            { id: 'byeong', hanja: '丙', korean: '병', element: '화(火)', yinyang: '양(+)', desc: '만물을 비추는 태양(太陽)입니다. 숨김없이 솔직하고 명랑하며 열정적인 성향을 띠고 있습니다. 따뜻한 마음으로 베풀기를 좋아하고, 공명정대하여 지도자나 공직에 잘 맞으며 추진력이 돋보입니다.<br/><br/><span class="font-bold text-indigo-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>태양처럼 숨기는 것이 없어 비밀을 오래 간직하지 못합니다. 화통하고 뒤끝이 없으나, 너무 솔직한 성격 탓에 구설에 오르기 쉽습니다. 예술, 방송, 교육 등 자신을 드러내고 남을 비추는 화려한 직업군에서 대성할 수 있습니다.', abundanceDesc: '성격이 지나치게 급하고 다혈질이 되며, 감정 표현이 너무 직선적이라 실수하거나 구설에 오르기 쉽습니다.' },
            { id: 'jeong', hanja: '丁', korean: '정', element: '화(火)', yinyang: '음(-)', desc: '어둠을 밝히는 촛불(燭)이나 모닥불입니다. 따뜻하고 세심하며 은근한 끈기가 있습니다. 희생정신과 봉사정신이 투철하여 사람들에게 위안을 주며, 종교, 의료, 예술 방면에 뛰어난 잠재력을 보입니다.<br/><br/><span class="font-bold text-indigo-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>겉보기엔 조용해도 속에는 용광로 같은 열정을 품고 있습니다. 촛불이 자신을 태워 세상을 밝히듯, 활인업(사람을 살리고 돕는 직업)에 종사하면 크게 발복합니다. 다만, 한 번 화가 나면 걷잡을 수 없이 폭발하므로 감정 관리가 중요합니다.', abundanceDesc: '질투심이나 집착이 강해지고 신경질적이 되며, 혼자 속을 끓이거나 감정의 기복이 겉잡을 수 없이 커질 수 있습니다.' },
            { id: 'mu', hanja: '戊', korean: '무', element: '토(土)', yinyang: '양(+)', desc: '넓은 광야나 거대한 산(大地)입니다. 스케일이 크고 포용력이 있으며 듬직하고 매사에 신중합니다. 중심을 잘 잡고 흔들리지 않아 든든한 조력자나 관리자 역할을 훌륭히 해내며 묵직한 신뢰감을 줍니다.<br/><br/><span class="font-bold text-indigo-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>태산처럼 과묵하여 속을 잘 알 수 없습니다. 신용을 최우선으로 여기며 중재자 역할에 탁월합니다. 하지만 지나치게 신중하여 행동이 굼뜨거나 기회를 놓칠 수 있고, 한 번 고집을 부리면 산처럼 요지부동이니 타협이 어렵습니다.', abundanceDesc: '고집불통이 되어 융통성이 매우 떨어지고, 행동이 굼뜨거나 현실 안주, 무사안일주의에 빠질 수 있습니다.' },
            { id: 'gi', hanja: '己', korean: '기', element: '토(土)', yinyang: '음(-)', desc: '농작물이 자라는 비옥한 전답(開墾地)입니다. 온화하고 다정하며 세심하게 타인을 배려합니다. 실속을 잘 챙기고 포용력이 있어 중간 관리자나 참모, 사람을 대하는 서비스 직무에 제격입니다.<br/><br/><span class="font-bold text-indigo-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>어머니의 대지처럼 만물을 길러내는 힘이 있어 교육, 보육, 원예 등의 분야와 인연이 깊습니다. 무토가 큰 스케일이라면 기토는 아기자기하고 자기 실속을 잘 챙기는 타입입니다. 다만 의심이 많아 스스로 기회를 놓치는 경우가 있습니다.', abundanceDesc: '속을 알 수 없고 의심이 많아지며, 이기적인 성향이나 결정장애(우유부단함)가 심해져 기회를 놓치기 쉽습니다.' },
            { id: 'gyeong', hanja: '庚', korean: '경', element: '금(金)', yinyang: '양(+)', desc: '단단한 바위(巖)나 제련되지 않은 무쇠입니다. 의리와 명분을 중시하며 결단력과 추진력이 강합니다. 한번 결정하면 밀어붙이는 개혁적인 성향으로 사법, 군인, 경찰, 굳건한 조직 생활에 잘 어울립니다.<br/><br/><span class="font-bold text-indigo-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>가을의 서릿발처럼 맺고 끊음이 확실합니다. 의리를 목숨처럼 여겨 내 사람에겐 한없이 잘하지만, 적이 되면 가차 없이 잘라냅니다. 사법, 군경, 의료, 기계/IT 등 단단하고 날카로운 물질을 다루는 직업에서 크게 성공합니다.', abundanceDesc: '지나치게 냉혹하고 강압적이며 흑백논리가 심해 타인과 시비나 다툼, 관재구설이 끊이지 않을 수 있습니다.' },
            { id: 'sin', hanja: '辛', korean: '신', element: '금(金)', yinyang: '음(-)', desc: '정교하게 가공된 보석(珠玉)이나 날카로운 칼입니다. 깔끔하고 예민하며 섬세한 미적 감각을 지녔습니다. 완벽주의 성향이 강하고 예리한 판단력을 갖추어 회계, 설계, 의료, 수사 직무 등에 탁월한 능력을 발휘합니다.<br/><br/><span class="font-bold text-indigo-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>이미 완성된 보석이므로 남의 시선을 즐기며 인정받기를 원합니다. 호불호가 극명하고 자존심이 대단히 강합니다. 칼날 같은 예리함으로 정밀한 작업에 뛰어나지만, 독설로 인해 인간관계에서 스스로 단절을 겪기 쉽습니다.', abundanceDesc: '신경이 너무 날카롭고 까다로우며, 차갑고 예리한 언행으로 타인에게 큰 상처를 주고 스스로를 옭아맬 수 있습니다.' },
            { id: 'im', hanja: '壬', korean: '임', element: '수(水)', yinyang: '양(+)', desc: '넓은 바다나 큰 강물(大洋)입니다. 지혜롭고 깊이가 있으며 포용력이 넓어 만물을 수용합니다. 유연하게 상황에 대처하는 능력이 뛰어나며, 은은하게 뻗어나가는 기운으로 무역, 외교, 교육의 기질이 돋보입니다.<br/><br/><span class="font-bold text-indigo-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>바다처럼 모든 것을 수용하지만 뱃속이 너무 깊어 속마음을 알기 어렵습니다. 두뇌 회전이 대단히 빠르고 융통성이 좋아 처세술에 능합니다. 물의 속성상 흐르고 이동하는 유통, 해운, 무역, 외교 분야로 진출하면 재물을 크게 모읍니다.', abundanceDesc: '생각이 너무 많아 우울감에 빠지거나 속을 알 수 없고, 한 곳에 정착하지 못하고 이곳저곳 방황할 수 있습니다.' },
            { id: 'gye', hanja: '癸', korean: '계', element: '수(水)', yinyang: '음(-)', desc: '만물을 적시는 옹달샘이나 이슬(露)입니다. 맑고 영민하며 감수성이 풍부하고 아이디어가 샘솟습니다. 환경에 맞춰 자신의 모습을 바꾸는 적응력이 탁월하며, 기획력, 창의력, 예술성이 뛰어납니다.<br/><br/><span class="font-bold text-indigo-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>이슬처럼 연약해 보이지만 어떤 틈새로도 스며드는 치밀한 생존력이 있습니다. 지략이 뛰어나 기획과 아이디어 뱅크 역할을 합니다. 계산이 빠르고 실속을 차리지만, 얕은 꾀에 스스로 넘어갈 수 있어 우직함을 기르는 것이 중요합니다.', abundanceDesc: '잔머리를 너무 굴리다 오히려 손해를 보거나, 변덕이 극심하고 성향이 다소 음침해져 음모를 꾸밀 수 있습니다.' },
        ];

        const jijiData = [
            { id: 'ja', hanja: '子', korean: '자', animal: '쥐', element: '수(水)', yinyang: '양(+)', season: '겨울 (11월)', desc: '만물이 씨앗 속에 잉태된 한겨울의 물을 의미합니다. 지혜롭고 번식력이 강하며, 새로운 시작을 준비하는 잠재력이 있습니다. 기획력과 아이디어가 출중하여 무언가를 새롭게 창조하고 시작하는 데 매우 유리한 기운입니다.<br/><br/><span class="font-bold text-amber-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>밤에 활동하거나 숨어서 하는 은밀한 연구, 기획 등에 유리합니다. 번식과 잉태를 상징하므로 도화(인기)와 연관이 깊고 사람을 끄는 매력이 있습니다. 단, 생각이 너무 많아 시작만 하고 결실을 맺지 못하는 용두사미가 되기 쉽습니다.', abundanceDesc: '비밀이 많아지고 속을 감추어 음흉해 보일 수 있으며, 우울증에 취약하고 잦은 변덕이나 이성(색정) 문제에 휘말리기 쉽습니다.' },
            { id: 'chuk', hanja: '丑', korean: '축', animal: '소', element: '토(土)', yinyang: '음(-)', season: '겨울 (12월)', desc: '언 땅 속에서 봄을 기다리는 끈기와 인내의 상징입니다. 근면 성실하고 우직하며 속도가 느려도 목표를 향해 묵묵히 나아가는 강한 저력이 있습니다. 궂은일도 마다하지 않는 희생정신을 지닙니다.<br/><br/><span class="font-bold text-amber-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>소처럼 묵묵히 일하며 인내의 아이콘입니다. 얼어붙은 땅이므로 삶에 고난과 인내가 따르는 편이나, 이를 극복하고 대기만성하는 사주입니다. 한 번 터지면 화산처럼 폭발하므로 평소 감정을 너무 억누르지 않는 것이 중요합니다.', abundanceDesc: '지나치게 보수적이고 아집이 강하며 과거에 얽매이기 쉽습니다. 또한 융통성이 부족해지고 위장 장애나 수족냉증에 유의해야 합니다.' },
            { id: 'in', hanja: '寅', korean: '인', animal: '호랑이', element: '목(木)', yinyang: '양(+)', season: '봄 (1월)', desc: '만물이 겨울잠에서 깨어나는 역동적인 초봄의 기운입니다. 기세가 맹렬하고 권위와 독립심이 강하며 훌륭한 리더십을 발휘합니다. 불의를 참지 못하고 앞으로 나아가려는 개척 정신이 매우 강합니다.<br/><br/><span class="font-bold text-amber-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>범이 산에서 내려오듯 추진력과 배짱이 대단합니다. 새로운 일을 기획하고 벌이는 역마(이동)의 기운이 강하며, 건축, 기획, 교육 분야의 리더 격입니다. 위세만 당당하고 실속이 없을 수 있으니 꼼꼼한 마무리가 필요합니다.', abundanceDesc: '권위적이고 독단적으로 변하기 쉬워 타인과의 충돌이 잦아집니다. 시작은 거창하나 마무리가 부족할 수 있고 신경성 질환을 주의해야 합니다.' },
            { id: 'myo', hanja: '卯', korean: '묘', animal: '토끼', element: '목(木)', yinyang: '음(-)', season: '봄 (2월)', desc: '새싹이 지면을 뚫고 올라와 잎이 무성해지는 완연한 봄입니다. 부드럽고 상냥하며 친화력이 좋아 대인관계가 원만합니다. 예술적 감각이 뛰어나고 세심하며 자신을 가꾸고 꾸미는 재주가 훌륭합니다.<br/><br/><span class="font-bold text-amber-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>토끼처럼 민첩하고 인기가 많아 십이지지 중 가장 대표적인 도화살입니다. 미용, 패션, 인테리어, 예술 등 장식성과 손재주를 요하는 직업에 천부적입니다. 귀가 얇고 끈기가 다소 부족해 한 우물을 파는 훈련이 평생 과제입니다.', abundanceDesc: '한 가지 일에 집중하지 못하고 귀가 얇아 변덕이 심해집니다. 예민함이 극에 달해 히스테리나 신경쇠약을 겪고 끈기가 부족해질 수 있습니다.' },
            { id: 'jin', hanja: '辰', korean: '진', animal: '용', element: '토(土)', yinyang: '양(+)', season: '봄 (3월)', desc: '만물이 쑥쑥 자라나는 늦봄의 촉촉하고 생명력 넘치는 땅입니다. 스케일이 크고 배포가 있으며 이상과 꿈이 높습니다. 임기응변에 강하고 다양한 잠재력과 재주를 품고 있어 어떤 상황에서도 잘 적응합니다.<br/><br/><span class="font-bold text-amber-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>용은 상상의 동물이듯 이상향을 추구하며 변화무쌍합니다. 모든 봄의 기운을 담아두는 창고 역할을 하여 다재다능한 만능 재주꾼입니다. 하지만 현실 감각이 떨어져 몽상가가 되기 쉬우며, 강력한 자기주장으로 주변과 마찰을 빚기 쉽습니다.', abundanceDesc: '허세가 심해지고 이상만 앞서 현실성이 떨어집니다. 자존심이 너무 강해 타협을 못 하며 대인관계 구설수와 피부/위장 질환에 취약해집니다.' },
            { id: 'sa', hanja: '巳', korean: '사', animal: '뱀', element: '화(火)', yinyang: '음(-)', season: '여름 (4월)', desc: '양기가 점차 강해져 열매를 맺기 시작하는 초여름입니다. 두뇌가 명석하고 열정적이며 화려한 것을 좋아합니다. 말솜씨가 좋고 변화와 활동성이 두드러져 주변의 시선을 끄는 매력적인 기운을 뿜어냅니다.<br/><br/><span class="font-bold text-amber-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>뱀처럼 은밀하게 움직이다가도 결정적일 때 목표를 낚아챕니다. 방송, 언론, 통신, 항공, 역마 등 빠르고 화려한 직업군이나 화술을 요하는 직업에서 대성합니다. 변덕스럽고 성질이 불같아 인간관계의 굴곡을 조심해야 합니다.', abundanceDesc: '감정 기복이 극심하고 독선적이며 타인을 지나치게 의심하게 됩니다. 심혈관 질환이나 시력 저하, 화상 사고 등에 각별한 주의가 필요합니다.' },
            { id: 'o', hanja: '午', korean: '오', animal: '말', element: '화(火)', yinyang: '양(+)', season: '여름 (5월)', desc: '태양이 가장 높이 뜨는 한여름의 뜨거운 열기입니다. 매사에 적극적이고 열정적이며 활동 반경이 넓습니다. 화끈하고 솔직 담백하며 긍정적인 에너지로 주변을 즐겁게 만드는 뛰어난 사교성을 가집니다.<br/><br/><span class="font-bold text-amber-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>야생마처럼 자유분방하며 화려하게 자신을 드러내는 강력한 도화살입니다. 거짓이 없고 뒤끝이 깔끔하지만, 충동적이고 다혈질적인 욱하는 성격을 억눌러야 합니다. 마케팅, 영업, 스포츠, 방송 분야에서 기량을 맘껏 펼칩니다.', abundanceDesc: '폭발적인 다혈질 성향이 나타나고 감정 조절이 어려워 쉽게 흥분합니다. 인내심이 부족해지고 심장 질환이나 구설, 시비에 잦게 오르내립니다.' },
            { id: 'mi', hanja: '未', korean: '미', animal: '양', element: '토(土)', yinyang: '음(-)', season: '여름 (6월)', desc: '가을을 준비하는 뜨거운 늦여름의 마른 땅입니다. 겉보기엔 유순하고 부드러우나 속으로는 강한 고집과 끈기를 감춘 외유내강형입니다. 희생정신이 남다르고 어떤 어려움도 참고 견디는 인내심을 보여줍니다.<br/><br/><span class="font-bold text-amber-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>순한 양처럼 보이지만 한 번 고집을 부리면 누구도 꺾지 못하는 매서운 뚝심이 있습니다. 척박한 마른 땅에서 생명을 품어내듯 활인, 의료, 복지, 종교 등의 분야에서 탁월합니다. 까다로운 성미와 조급증을 둥글게 다듬어야 평안합니다.', abundanceDesc: '겉과 속이 다르고 자존심을 건드리면 크게 폭발하는 신경질적인 면이 있습니다. 조급증이 생기고 위장염이나 소화계 질환에 노출되기 쉽습니다.' },
            { id: 'sin_j', hanja: '申', korean: '신', animal: '원숭이', element: '금(金)', yinyang: '양(+)', season: '가을 (7월)', desc: '열매가 단단해지기 시작하는 초가을의 결실의 기운입니다. 다재다능하고 눈치가 빠르며 모방과 응용력이 뛰어납니다. 결단력이 있고 밖으로 돌아다니며 활동하는 역마의 성향을 가져 다방면에서 유능함을 보입니다.<br/><br/><span class="font-bold text-amber-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>원숭이처럼 다재다능하고 호기심이 많아 못 하는 것이 없는 팔방미인입니다. 강력한 금속과 역마성(이동)을 상징하여 사법, 금융, 의료, 무역, 기계/IT 분야에 길합니다. 자기 꾀에 자기가 넘어가는 우를 범하기 쉬우니 겸손해야 합니다.', abundanceDesc: '자기 꾀에 넘어가기 쉽고 지나치게 이해타산적이며 이기적으로 변합니다. 타인과의 마찰, 뼈/관절 질환이나 교통사고 등에 유의해야 합니다.' },
            { id: 'yu', hanja: '酉', korean: '유', animal: '닭', element: '금(金)', yinyang: '음(-)', season: '가을 (8월)', desc: '열매가 완전히 여문 수확과 결실의 완연한 가을입니다. 맺고 끊음이 확실한 단호함과 예리함이 있으며 깔끔하고 정밀한 것을 선호합니다. 직관력과 통찰력이 뛰어나 세밀한 작업이나 평가에 탁월한 재주가 있습니다.<br/><br/><span class="font-bold text-amber-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>가공이 끝난 보석으로 빛을 발하는 가장 강력한 도화의 기운입니다. 정밀성과 예리함을 바탕으로 금융, 회계, 보석 세공, 정밀 기술 직종에 천부적입니다. 닭의 부리처럼 타인의 단점을 쪼아대는 비판적 성향을 다스려야 적을 만들지 않습니다.', abundanceDesc: '극도의 완벽주의와 결벽증이 나타나며 타인의 단점을 지적하는 예리한 언행으로 적을 만들기 쉽습니다. 호흡기 건강 약화에 주의해야 합니다.' },
            { id: 'sul', hanja: '戌', korean: '술', animal: '개', element: '토(土)', yinyang: '양(+)', season: '가을 (9월)', desc: '추수를 마치고 만물을 보관하는 늦가을의 창고 같은 땅입니다. 책임감이 강하고 충성심이 돋보이며 의리를 중시합니다. 자신이 맡은 바를 끝까지 지켜내고 사람을 한번 믿으면 끝까지 헌신하는 듬직함이 있습니다.<br/><br/><span class="font-bold text-amber-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>집을 맹렬히 지키는 진돗개처럼 책임감과 충성심이 대단하지만, 아군과 적군을 명확히 가르는 경계심이 강합니다. 교육, 종교, 부동산, 보관/경비직과 인연이 깊습니다. 타인과 융화되지 못하고 옹고집으로 고립되는 것을 몹시 경계해야 합니다.', abundanceDesc: '타인과 타협하지 않는 옹고집이 심해져 대인관계가 단절되기 쉬우며, 의심과 경계심이 병적으로 강해지고 위장/피부 질환이 만성화될 수 있습니다.' },
            { id: 'hae', hanja: '亥', korean: '해', animal: '돼지', element: '수(水)', yinyang: '음(-)', season: '겨울 (10월)', desc: '만물이 휴식에 들어가는 초겨울의 포용력 넘치는 기운입니다. 지혜를 모으고 보이지 않는 정신적인 영역을 중시하며 속이 깊습니다. 넓은 이해심과 넉넉함으로 누구와도 잘 어울리며 유연한 태도로 삶의 지혜를 발휘합니다.<br/><br/><span class="font-bold text-amber-700"><i class="fas fa-search mr-1"></i>[실전 통변 포인트]</span><br/>보이지 않는 겨울밤의 바다처럼 통찰력이 깊고 생각의 스케일이 남다릅니다. 뛰어난 영감과 직관을 살려 철학, 종교, 심리, 외교/무역업에서 역량을 발휘합니다. 공상에만 빠져 구체적인 실행력이 떨어질 수 있으니 행동력을 길러야 성공합니다.', abundanceDesc: '속마음을 지나치게 감추어 오해를 사거나 겉과 속이 다르게 행동할 수 있습니다. 우울감에 빠지기 쉽고 잦은 변동으로 인한 피로에 시달립니다.' },

                                    추운 겨울(기신운, 나쁜 운)이 오면 외출을 삼가고 집에서 공부를 하며 내실을 다지듯, 운이 안 좋을 때는 투자를 줄이고 스펙을 쌓으며 웅크려야 합니다. 반면 봄과 여름(용신운, 좋은 운)이 오면 실패를 두려워하지 말고 밖으로 나가 적극적으로 씨를 뿌리고 쟁취해야 합니다. <strong>사주 명리학의 진짜 목적은 '일기예보'를 보고 내 인생의 나아갈 때와 물러설 때를 아는 지혜에 있습니다.</strong>
                                </p>
                            </div>
                        </div>
                    </div>
                `
            }
        ];

        /* ==========================================
           5. 상태 관리 및 유틸 함수
        ========================================== */
        let state = {
            activeTab: 'course', // 기본 탭: 기초 개념 코스
            activeCourseId: 'intro',
            selectedCheongan: cheonganData[0],
            selectedJiji: jijiData[0],
            comboCheongan: cheonganData[0],
            comboJiji: jijiData[0],
            sajuInput: {
                yearC: cheonganData[0], yearJ: jijiData[0],
                monthC: cheonganData[2], monthJ: jijiData[2],
                dayC: cheonganData[4], dayJ: jijiData[4],
                hourC: cheonganData[6], hourJ: jijiData[8]
            },
            selectingSlot: null
        };

        window.setActiveTab = function(tab) {
            state.activeTab = tab;
            state.selectingSlot = null;
            renderApp();
        };

        window.setCourseId = function(id) {
            state.activeCourseId = id;
            renderApp();
        };

        window.setSelectedCheongan = function(id) { state.selectedCheongan = cheonganData.find(item => item.id === id); renderApp(); };
        window.setSelectedJiji = function(id) { state.selectedJiji = jijiData.find(item => item.id === id); renderApp(); };
        window.setComboCheongan = function(id) { state.comboCheongan = cheonganData.find(item => item.id === id); renderApp(); };
        window.setComboJiji = function(id) { state.comboJiji = jijiData.find(item => item.id === id); renderApp(); };

        window.setSelectingSlot = function(slot) {
            state.selectingSlot = state.selectingSlot === slot ? null : slot;
            renderApp();
        };

        window.setSajuInput = function(id, isCheongan) {
            const data = isCheongan ? cheonganData.find(item => item.id === id) : jijiData.find(item => item.id === id);
            if (state.selectingSlot && data) {
                const slot = state.selectingSlot;
                state.sajuInput[slot] = data;

                const prefix = slot.slice(0, -1);
                const isC = slot.endsWith('C');
                const pairedSlot = isC ? prefix + 'J' : prefix + 'C';
                const pairedData = state.sajuInput[pairedSlot];

                if (pairedData.yinyang !== data.yinyang) {
                    if (isC) {
                        state.sajuInput[pairedSlot] = jijiData.find(j => j.yinyang === data.yinyang);
                    } else {
                        state.sajuInput[pairedSlot] = cheonganData.find(c => c.yinyang === data.yinyang);
                    }
                }

                state.selectingSlot = null;
                renderApp();
            }
        };

        function renderMiniNode(koreanName, isCheongan) {
            if (!koreanName || koreanName === '없음') {
                return `<div class="w-14 h-14 md:w-16 md:h-16 flex items-center justify-center bg-neutral-100 text-neutral-400 rounded-full text-xs font-medium border border-neutral-200">없음</div>`;
            }
            const data = isCheongan ? cheonganData.find(d => d.korean === koreanName) : jijiData.find(d => d.korean === koreanName);
            if (!data) return '';
            const colors = elementColors[data.element];
            return `
                <button onclick="${isCheongan ? `setSelectedCheongan('${data.id}')` : `setSelectedJiji('${data.id}')`}" class="flex flex-col items-center justify-center w-14 h-14 md:w-16 md:h-16 rounded-full border-2 ${colors.border} ${colors.bg} shadow-sm transition-transform hover:scale-110 cursor-pointer focus:outline-none">
                    <span class="text-xl md:text-2xl font-bold ${colors.text}">${data.hanja}</span>
                    <span class="text-[10px] md:text-xs font-semibold text-neutral-700">${data.korean}</span>
                </button>
            `;
        }

        function getSipseong(stem, branch) {
            const sIdx = elementsArray.indexOf(stem.element);
            const bIdx = elementsArray.indexOf(branch.element);
            const sYinYang = stem.yinyang;
            const bYinYangReal = jijiYongYinYang[branch.korean]; 
            const isSameYinYang = (sYinYang === bYinYangReal);
            let name = '';
            let sElement = stem.element.replace(/[^가-힣]/g, '');
            let bElement = branch.element.replace(/[^가-힣]/g, '');
            let reasonDesc = '';
            let yongExplain = isSameYinYang ? '같아' : '달라';

            if (branch.yinyang !== bYinYangReal) {
                reasonDesc += `<span class="block text-xs text-indigo-500 mb-1.5 bg-white px-2 py-1 border border-indigo-100 rounded inline-block">※ 참고: '${branch.korean}'는 명목상 ${branch.yinyang}이지만 십성(본기)은 <b>${bYinYangReal}</b>으로 봅니다.</span><br/>`;
            }

            if (sIdx === bIdx) { name = isSameYinYang ? '비견(比肩)' : '겁재(劫財)'; reasonDesc += `천간과 지지가 같은 <b>${sElement}</b> 오행이며, 음양이 서로 ${yongExplain} <strong>${name}</strong>이 됩니다.`; }
            else if ((sIdx + 1) % 5 === bIdx) { name = isSameYinYang ? '식신(食神)' : '상관(傷官)'; reasonDesc += `천간(${sElement})이 지지(${bElement})를 <b>생(生)</b>해주고(내가 낳음), 음양이 서로 ${yongExplain} <strong>${name}</strong>이 됩니다.`; }
            else if ((sIdx + 2) % 5 === bIdx) { name = isSameYinYang ? '편재(偏財)' : '정재(正財)'; reasonDesc += `천간(${sElement})이 지지(${bElement})를 <b>극(剋)</b>하여(내가 통제함), 음양이 서로 ${yongExplain} <strong>${name}</strong>이 됩니다.`; }
            else if ((sIdx + 3) % 5 === bIdx) { name = isSameYinYang ? '편관(偏官)' : '정관(正官)'; reasonDesc += `지지(${bElement})가 천간(${sElement})을 <b>극(剋)</b>하여(나를 통제함), 음양이 서로 ${yongExplain} <strong>${name}</strong>이 됩니다.`; }
            else if ((sIdx + 4) % 5 === bIdx) { name = isSameYinYang ? '편인(偏印)' : '정인(正印)'; reasonDesc += `지지(${bElement})가 천간(${sElement})을 <b>생(生)</b>해주고(나를 낳음), 음양이 서로 ${yongExplain} <strong>${name}</strong>이 됩니다.`; }

            const pureName = name.split('(')[0];
            return { name: name, desc: reasonDesc, meaning: sipseongDict[pureName] };
        }

        function getSipseongGeneric(baseStem, targetObj, isTargetJiji) {
            const sIdx = elementsArray.indexOf(baseStem.element);
            const tIdx = elementsArray.indexOf(targetObj.element);
            let tYinYang = isTargetJiji ? jijiYongYinYang[targetObj.korean] : targetObj.yinyang;
            const isYinYangMatch = baseStem.yinyang === tYinYang;
            const diff = (tIdx - sIdx + 5) % 5;
            
            let name = '';
            if (diff === 0) name = isYinYangMatch ? '비견' : '겁재';
            if (diff === 1) name = isYinYangMatch ? '식신' : '상관';
            if (diff === 2) name = isYinYangMatch ? '편재' : '정재';
            if (diff === 3) name = isYinYangMatch ? '편관' : '정관';
            if (diff === 4) name = isYinYangMatch ? '편인' : '정인';
            return name;
        }

        function calculatePersonality(saju) {
            const dayMaster = saju.dayC;
            const pillars = [
                { obj: saju.yearC, isJiji: false, weight: 1 },
                { obj: saju.yearJ, isJiji: true, weight: 1 },
                { obj: saju.monthC, isJiji: false, weight: 1 },
                { obj: saju.monthJ, isJiji: true, weight: 3 },
                { obj: saju.dayC, isJiji: false, weight: 1 },
                { obj: saju.dayJ, isJiji: true, weight: 1.5 },
                { obj: saju.hourC, isJiji: false, weight: 1 },
                { obj: saju.hourJ, isJiji: true, weight: 1.5 },
            ];

            let groupScores = { '비겁': 0, '식상': 0, '재성': 0, '관성': 0, '인성': 0 };
            let sipseongList = [];
            let johooScore = 0;

            pillars.forEach((p, idx) => {
                let sipseongName = (idx === 4) ? '비견' : getSipseongGeneric(dayMaster, p.obj, p.isJiji);
                sipseongList.push(sipseongName);
                
                let group = '';
                if (['비견', '겁재'].includes(sipseongName)) group = '비겁';
                if (['식신', '상관'].includes(sipseongName)) group = '식상';
                if (['편재', '정재'].includes(sipseongName)) group = '재성';
                if (['편관', '정관'].includes(sipseongName)) group = '관성';
                if (['편인', '정인'].includes(sipseongName)) group = '인성';
                groupScores[group] += p.weight;

                const el = p.obj.element;
                const kr = p.obj.korean;
                if (el === '화(火)') johooScore += p.weight;
                if (el === '수(水)') johooScore -= p.weight;
                if (['무', '술', '미'].includes(kr)) johooScore += p.weight * 0.8;
                if (['기', '진', '축'].includes(kr)) johooScore -= p.weight * 0.8;
            });

            let sortedGroups = Object.entries(groupScores).sort((a, b) => b[1] - a[1]);
            let totalWeight = Object.values(groupScores).reduce((a, b) => a + b, 0);

            let chemistries = [];
            if (sipseongList.includes('식신') && sipseongList.includes('편인')) {
                chemistries.push({ name: '도식(倒食)', desc: '번뜩이는 아이디어(식신)는 많으나, 실행 단계에서 생각(편인)이 너무 많아 주저하거나 엎어질 수 있습니다.' });
            }
            if (sipseongList.includes('상관') && sipseongList.includes('정관')) {
                chemistries.push({ name: '상관견관(傷官見官)', desc: '불합리한 틀(정관)을 깨고 싶어 하는 혁신가적 기질(상관)이 발동합니다. 트러블메이커가 될 수도, 개혁가가 될 수도 있습니다.' });
            }
            if ((sipseongList.includes('편재') || sipseongList.includes('정재')) && (sipseongList.includes('편관') || sipseongList.includes('정관'))) {
                chemistries.push({ name: '재생관(財生官)', desc: '목표 달성 욕구(재성)와 책임감(관성)이 결합되어, 조직에서 무섭게 인정받는 워커홀릭 성향이 나타납니다.' });
            }
            if ((sipseongList.includes('비견') || sipseongList.includes('겁재')) && (sipseongList.includes('편재') || sipseongList.includes('정재')) && groupScores['비겁'] > groupScores['재성']) {
                chemistries.push({ name: '군겁쟁재(群劫爭財)', desc: '경쟁심이 매우 강하고, 목표나 결과를 쟁취하기 위해 치열하게 다투거나 이익을 나누어야 하는 상황에 예민하게 반응합니다.' });
            }

            return {
                dayMaster: dayMaster,
                groupScores: groupScores,
                sortedGroups: sortedGroups,
                totalWeight: totalWeight,
                johooScore: johooScore,
                chemistries: chemistries
            };
        }

        /* ==========================================
           6. UI 렌더링 함수들
        ========================================== */

                            <div class="flex-1 w-full">
                                <div class="flex flex-wrap items-center gap-3 mb-2">

            inputHtml += `</div>`;

            let paletteHtml = '';
            if (selecting) {
                const isCheongan = selecting.includes('C');
                const list = isCheongan ? cheonganData : jijiData;
                let btns = list.map(item => {
                    const col = elementColors[item.element];
                    return `<button onclick="setSajuInput('${item.id}', ${isCheongan})" class="flex flex-col items-center justify-center p-2 rounded-lg border border-neutral-200 hover:border-sky-400 ${col.bg} bg-opacity-50 transition-colors"><span class="text-xl font-bold ${col.text}">${item.hanja}</span><span class="text-xs text-neutral-600">${item.korean}</span></button>`;
                }).join('');
                paletteHtml = `<div class="bg-sky-50 border border-sky-200 rounded-xl p-4 mb-8"><div class="flex justify-between items-center mb-3"><h4 class="text-sm font-bold text-sky-800">변경할 글자를 선택하세요 (${isCheongan ? '천간' : '지지'})</h4><button onclick="setSelectingSlot(null)" class="text-neutral-400 hover:text-neutral-600"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="grid grid-cols-5 md:grid-cols-10 gap-2">${btns}</div></div>`;
            } else { paletteHtml = `<div class="h-4"></div>`; }

            const result = calculatePersonality(si);
            const top1 = result.sortedGroups[0];
            const top2 = result.sortedGroups[1];
            let comboKey1 = `${top1[0]}_${top2[0]}`;
            let comboKey2 = `${top2[0]}_${top1[0]}`;
            let synergy = synergyDesc[comboKey1] || synergyDesc[comboKey2] || { title: '다재다능한 균형자형', desc: '특정 기운에 치우치지 않고 여러 기운을 고루 활용하는 균형 잡힌 성향입니다.' };

            let johooText = '', johooColor = '', johooIcon = '';
            if (result.johooScore > 2) { johooText = '조열(燥熱): 화/토 기운이 강해 성격이 밝고 열정적이며 급한 편입니다.'; johooColor = 'text-red-600 bg-red-100 border-red-200'; johooIcon = 'flame'; }
            else if (result.johooScore < -2) { johooText = '한습(寒濕): 수/습토 기운이 강해 차분하고 속이 깊으며 내향적인 편입니다.'; johooColor = 'text-blue-600 bg-blue-100 border-blue-200'; johooIcon = 'droplets'; }
            else { johooText = '조화(調和): 온도감이 한쪽으로 치우치지 않아 정서적으로 안정감이 있습니다.'; johooColor = 'text-emerald-600 bg-emerald-100 border-emerald-200'; johooIcon = 'thermometer-sun'; }

            let statsHtml = result.sortedGroups.map(([name, score]) => {
                const percent = Math.round((score / result.totalWeight) * 100) || 0;
                let bgFill = 'bg-neutral-500';
                if(name === '비겁') bgFill = 'bg-green-500';
                if(name === '식상') bgFill = 'bg-red-500';
                if(name === '재성') bgFill = 'bg-yellow-500';
                if(name === '관성') bgFill = 'bg-slate-500';
                if(name === '인성') bgFill = 'bg-blue-500';

                let interpretHtml = '';
                if (percent >= 35) interpretHtml = `<div class="mt-1.5 p-2 bg-rose-50 border border-rose-100 rounded text-xs text-rose-800 flex items-start gap-1.5"><i data-lucide="alert-circle" class="w-3.5 h-3.5 mt-0.5 shrink-0 text-rose-500"></i><span><b>과다 (${name}):</b> ${sipseongAmountDesc[name]['과다']}</span></div>`;
                else if (percent === 0) interpretHtml = `<div class="mt-1.5 p-2 bg-stone-100 border border-stone-200 rounded text-xs text-stone-700 flex items-start gap-1.5"><i data-lucide="info" class="w-3.5 h-3.5 mt-0.5 shrink-0 text-stone-500"></i><span><b>무/고립 (${name}):</b> ${sipseongAmountDesc[name]['무']}</span></div>`;
                
                return `
                    <div class="mb-4">
                        <div class="flex justify-between text-sm font-bold text-neutral-700 mb-1"><span>${name} <span class="text-[10px] text-neutral-400 ml-1 font-normal">${sipseongGroupDesc[name].split(',')[0]}</span></span><span>${percent}%</span></div>
                        <div class="w-full bg-neutral-200 rounded-full h-2.5 overflow-hidden"><div class="progress-bar-fill ${bgFill} h-2.5 rounded-full" style="width: 0%" data-width="${percent}%"></div></div>
                        ${interpretHtml}
                    </div>
                `;
            }).join('');

            let chemHtml = result.chemistries.length > 0 ? result.chemistries.map(c => `<div class="bg-white border-l-4 border-fuchsia-400 p-3 rounded shadow-sm mb-2"><div class="font-bold text-fuchsia-800 text-sm mb-1">${c.name}</div><div class="text-xs text-neutral-600 leading-snug">${c.desc}</div></div>`).join('') : `<div class="text-sm text-neutral-500 italic p-2">특수 화학반응은 관찰되지 않습니다.</div>`;

            return `
                <div class="mt-4 fade-in">
                    <div class="mb-6 border-l-4 border-sky-500 pl-4">
                        <h2 class="text-2xl font-bold mb-2">사주 기반 성격 페르소나 분석</h2>
                        <p class="text-neutral-600">8글자를 입력하여 기질, 사회적 페르소나, 특수 성격 반응을 종합 분석합니다.</p>
                    </div>

                    <div class="bg-white border border-neutral-200 p-4 md:p-6 rounded-2xl shadow-sm mb-2">
                        <div class="flex justify-between items-end mb-4">
                            <h3 class="font-bold text-neutral-800 flex items-center"><i data-lucide="edit-3" class="w-4 h-4 mr-1.5"></i> 나의 사주 입력 (클릭하여 변경)</h3>
                            <span class="text-xs font-bold px-2 py-1 bg-neutral-100 text-neutral-500 rounded">월지 가중치 적용됨</span>
                        </div>
                        ${inputHtml}
                    </div>
                    ${paletteHtml}

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-1 flex flex-col gap-4">
                            <div class="bg-sky-50 border border-sky-100 p-5 rounded-2xl">
                                <h3 class="text-sm font-bold text-sky-800 mb-4 flex items-center border-b border-sky-200 pb-2"><i data-lucide="sun" class="w-4 h-4 mr-1.5"></i> 1. 일간(日干)의 기본 기질</h3>
                                <div class="flex items-center gap-4 mb-3">
                                    <div class="w-14 h-14 flex items-center justify-center bg-white rounded-full border-2 ${elementColors[result.dayMaster.element].border} shadow-sm"><span class="text-2xl font-bold ${elementColors[result.dayMaster.element].text}">${result.dayMaster.hanja}</span></div>
                                    <div><div class="font-bold text-lg text-neutral-800">${result.dayMaster.korean} (${result.dayMaster.element})</div><div class="text-xs text-neutral-500">나의 본질을 나타내는 핵심 글자</div></div>
                                </div>
                                <p class="text-sm font-medium text-sky-900 leading-relaxed bg-white p-3 rounded-lg shadow-sm border border-sky-100">"${baseNatureDesc[result.dayMaster.korean]}"<br/><br/><span class="text-xs text-sky-700 font-normal">${result.dayMaster.desc}</span></p>
                            </div>
                            <div class="bg-white border ${johooColor} p-5 rounded-2xl shadow-sm">
                                <h3 class="text-sm font-bold mb-3 flex items-center border-b pb-2" style="border-color: inherit;"><i data-lucide="${johooIcon}" class="w-4 h-4 mr-1.5"></i> 2. 정서적 안정도 (조후)</h3>
                                <p class="text-sm font-medium leading-relaxed">${johooText}</p>
                            </div>
                        </div>

                        <div class="lg:col-span-2 flex flex-col gap-4">
                            <div class="bg-gradient-to-br from-indigo-50 to-violet-100 border border-indigo-200 p-5 rounded-2xl shadow-sm">
                                <h3 class="text-sm font-bold text-indigo-800 mb-3 flex items-center"><i data-lucide="user-check" class="w-4 h-4 mr-1.5"></i> 3. 십성 조합 페르소나 (Top 1 + Top 2)</h3>
                                <div class="flex flex-wrap gap-2 mb-3"><span class="px-3 py-1 bg-indigo-600 text-white text-xs font-bold rounded-full shadow">1위: ${top1[0]}</span><span class="px-3 py-1 bg-violet-500 text-white text-xs font-bold rounded-full shadow">2위: ${top2[0]}</span></div>
                                <div class="bg-white p-4 rounded-xl border border-indigo-100 shadow-sm"><div class="text-lg font-extrabold text-indigo-900 mb-2">${synergy.title}</div><div class="text-sm text-neutral-700 leading-relaxed font-medium">"${synergy.desc}"</div></div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="bg-white border border-neutral-200 p-5 rounded-2xl shadow-sm">
                                    <h3 class="text-sm font-bold text-neutral-800 mb-4 flex items-center border-b border-neutral-100 pb-2"><i data-lucide="pie-chart" class="w-4 h-4 mr-1.5 text-neutral-500"></i> 4. 십성 구성비 (가중치 적용)</h3>
                                    ${statsHtml}
                                    <p class="text-[10px] text-neutral-400 mt-3 text-center">* 월지 환경의 영향력을 가장 크게(3배) 반영하였습니다.</p>
                                </div>
                                <div class="bg-fuchsia-50 border border-fuchsia-100 p-5 rounded-2xl shadow-sm">
                                    <h3 class="text-sm font-bold text-fuchsia-800 mb-4 flex items-center border-b border-fuchsia-200 pb-2"><i data-lucide="beaker" class="w-4 h-4 mr-1.5"></i> 5. 통변성 화학 반응 (특수 성향)</h3>
                                    ${chemHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        /* ==========================================
           7. 메인 라우터 (앱 진입점)
        ========================================== */
        function renderApp() {
            const app = document.getElementById('app');
            const { activeTab, selectedCheongan, selectedJiji, comboCheongan, comboJiji } = state;
            
            // 상단 공통 네비게이션
            let html = `
                <header class="mb-6 text-center">
                    <h1 class="text-3xl md:text-4xl font-black mb-3 text-neutral-900"><i class="fas fa-yin-yang text-indigo-600 mr-2"></i>명리심리상담사 종합 마스터 앱</h1>
                    <p class="text-neutral-600 text-sm md:text-base">기초 핵심 이론부터 사주 분석 알고리즘까지 명리학의 모든 것을 한곳에 담았습니다.</p>
                </header>

                <div class="flex flex-wrap justify-center gap-2 mb-6">
                    <button onclick="setActiveTab('course')" class="flex items-center px-4 py-2.5 rounded-full font-bold transition-all duration-300 shadow-sm ${activeTab === 'course' ? 'bg-indigo-600 text-white scale-105 ring-2 ring-indigo-300 ring-offset-2' : 'bg-white text-neutral-600 hover:bg-indigo-50 border border-neutral-200'}">
                        <i data-lucide="book-open" class="w-5 h-5 mr-2"></i> 기초 개념 (이론)
                    </button>
                    <button onclick="setActiveTab('cheongan')" class="flex items-center px-4 py-2.5 rounded-full font-bold transition-all duration-300 shadow-sm ${activeTab === 'cheongan' ? 'bg-indigo-600 text-white scale-105 ring-2 ring-indigo-300 ring-offset-2' : 'bg-white text-neutral-600 hover:bg-indigo-50 border border-neutral-200'}">
                        <i data-lucide="compass" class="w-5 h-5 mr-2"></i> 천간 (天干)
                    </button>
                    <button onclick="setActiveTab('jiji')" class="flex items-center px-4 py-2.5 rounded-full font-bold transition-all duration-300 shadow-sm ${activeTab === 'jiji' ? 'bg-amber-600 text-white scale-105 ring-2 ring-amber-300 ring-offset-2' : 'bg-white text-neutral-600 hover:bg-amber-50 border border-neutral-200'}">
                        <i data-lucide="layers" class="w-5 h-5 mr-2"></i> 지지 (地支)
                    </button>
                    <button onclick="setActiveTab('combiner')" class="flex items-center px-4 py-2.5 rounded-full font-bold transition-all duration-300 shadow-sm ${activeTab === 'combiner' ? 'bg-emerald-600 text-white scale-105 ring-2 ring-emerald-300 ring-offset-2' : 'bg-white text-neutral-600 hover:bg-emerald-50 border border-neutral-200'}">
                        <i data-lucide="link" class="w-5 h-5 mr-2"></i> 육십갑자 조합기
                    </button>
                    <button onclick="setActiveTab('personality')" class="flex items-center px-4 py-2.5 rounded-full font-bold transition-all duration-300 shadow-sm ${activeTab === 'personality' ? 'bg-sky-600 text-white scale-105 ring-2 ring-sky-300 ring-offset-2' : 'bg-white text-neutral-600 hover:bg-sky-50 border border-neutral-200'}">
                        <i data-lucide="brain-circuit" class="w-5 h-5 mr-2"></i> 사주 성격 분석
                    </button>
                </div>
            `;

            // 선택된 탭에 따라 콘텐츠 렌더링
            if (activeTab === 'course') {
                html += renderCourseTab();
            } else if (activeTab === 'cheongan') {
                html += renderCheonganTab(selectedCheongan);
            } else if (activeTab === 'jiji') {
                html += renderJijiTab(selectedJiji);
            } else if (activeTab === 'combiner') {
                const isComboValid = comboCheongan.yinyang === comboJiji.yinyang;
                const currentGapjaName = comboCheongan.korean + comboJiji.korean;
                const gapjaInfo = gapjaDetails[currentGapjaName];
                let sipseongInfo = isComboValid ? getSipseong(comboCheongan, comboJiji) : null;
                html += renderCombinerTab(comboCheongan, comboJiji, isComboValid, gapjaInfo, currentGapjaName, sipseongInfo);
            } else if (activeTab === 'personality') {
                html += renderPersonalityTab();
            }

            app.innerHTML = html;
            lucide.createIcons();
            
            // 프로그레스 바 애니메이션 구동 (사주 분석 탭)
            if (activeTab === 'personality') {
                setTimeout(() => {
                    const bars = document.querySelectorAll('.progress-bar-fill');
                    bars.forEach(bar => { bar.style.width = bar.getAttribute('data-width'); });
                }, 100);
            }
        }

        // 초기 시작
        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
